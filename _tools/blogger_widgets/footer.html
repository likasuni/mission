     모든 화면(홈&#183;게시글) 맨 아래에 보여요. 저장소 _tools/blogger_widgets/footer.html
     주소는 학원 홈페이지와 같게 씁니다. 교습비는 여기 쓰지 않아요 (홈페이지 수강료 페이지 기준).

<style>
/* 테마의 Credit 칸이 두 칸(Copyright/Attribution)으로 나뉘어 있어서, 이 가젯이 한 줄을 다 쓰게 함 */
#credit{flex-wrap:wrap!important}

#lkf *{box-sizing:border-box;max-width:100%;min-width:0}
#lkf a{text-decoration:none!important}
#lkf .band{box-sizing:border-box;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;width:100%;max-width:100%;overflow:hidden;padding:20px 22px;border-radius:16px;background:linear-gradient(135deg,#172554,#1e3a8a);color:#fff}
#lkf .band b{display:block;font-size:19px;font-weight:800;color:#fff}
#lkf .band small{display:block;margin-top:3px;font-size:14px;color:#d9e1ff}

#lkf .btns a{display:inline-flex;align-items:center;min-height:42px;padding:0 16px;border-radius:10px;font-size:14.5px;font-weight:800;white-space:nowrap}
#lkf .b1{background:#ffc857;color:#172554!important}
#lkf .b2{background:rgba(255,255,255,.14);color:#fff!important;border:1px solid rgba(255,255,255,.35)}
#lkf .ft{box-sizing:border-box;width:100%;max-width:100%;overflow:hidden;margin-top:14px;padding:4px 2px;font-size:13px;color:#8a93a8}
#lkf .ft a{color:#5b6478!important;font-weight:700}
@media(max-width:600px){
 #lkf .band{padding:18px 16px}
 #lkf .band b{font-size:17px}
 #lkf .btns a{flex:1 1 auto;justify-content:center}
}
</style>
<div id="lkf">
  <div class="band">
    <span><b>코코스학원 &#183; 리카수니 원장</b><small>분당 학교별 영어 내신 분석과 시험 대비반을 운영해요.</small></span>
    <span class="btns">
      <a class="b1" href="https://data.likasuni.com/naesin/">학교별 내신 분석 &#8594;</a>
      <a class="b2" href="https://www.cocosedu.co.kr/">코코스학원 홈페이지</a>
    </span>
  </div>
  <p class="ft">리카수니 블로그 &#183; <a href="https://data.likasuni.com/">리카수니 자료실</a> &#183; <a href="https://www.cocosedu.co.kr/">코코스학원</a> (경기 성남시 분당구 판교로 476 2층)</p>
</div>
<script>
(function(){
  /* 바닥글 칸은 본문보다 조금 넓어서, 본문(#main) 넓이에 맞춰 가운데 정렬합니다 */
  function fit(){
    var m=document.getElementById("main"),f=document.getElementById("lkf");
    if(!m||!f) return;
    f.style.width=""; f.style.marginLeft="";
    var mw=m.offsetWidth,fw=f.offsetWidth;
    if(mw&&fw&&mw!==fw){ f.style.width=mw+"px"; f.style.marginLeft=Math.round((fw-mw)/2)+"px"; }
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",fit); else fit();
  window.addEventListener("load",fit);
  window.addEventListener("resize",fit);
})();
</script>
