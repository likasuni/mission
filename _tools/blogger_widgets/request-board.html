<!-- 리카수니 블로그(www.likasuni.com)용 '자료 요청 · 최근 댓글' 상자
     자료실 첫 화면(lib.js recentComments)과 같은 내용. 자료실 Supabase 의 승인된 댓글을 30초마다 읽어 옴.
     Blogger 레이아웃 → 가젯 추가 → HTML/JavaScript 에 통째로 붙여 넣기 (제목 칸은 비워 두기) -->
<style>
/* 가젯 제목(관리용 이름)은 블로그 화면에서 숨김 */
.widget:has(#lks-rc) > h2, .widget:has(#lks-rc) > h3, .widget:has(#lks-rc) > .title { display: none !important; }
#lks-rc .lks-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
/* 자동광고가 머리 줄 안에 들어와도 제목을 밀지 않게: 광고는 맨 위 한 줄을 따로 차지 */
#lks-rc .lks-head > :not(.lks-live):not(.lks-title) { flex: 0 0 100%; order: -1; max-width: 100%; }
#lks-rc .lks-live i { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; animation: lkspulse 1.6s infinite; }
@keyframes lkspulse { 0% { box-shadow: 0 0 0 0 rgba(74,222,128,.7); } 70% { box-shadow: 0 0 0 8px rgba(74,222,128,0); } 100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); } }
#lks-rc .lks-rq { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; column-gap: 20px; }
#lks-rc .lks-rq li { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-top: 1px dashed #ead9ad; font-size: 14px; margin: 0; }
#lks-rc .lks-rq li:first-child, #lks-rc .lks-rq li:nth-child(2) { border-top: 0; }
#lks-rc a { text-decoration: none; }
#lks-rc .lks-more { display: block; width: 100%; margin: 6px 0 4px; padding: 6px; border: 0; border-radius: 8px; background: rgba(30,58,138,.06); color: #1e3a8a; font-size: 13px; font-weight: 700; cursor: pointer; }
@media (max-width: 640px) {
  #lks-rc .lks-rq { grid-template-columns: 1fr; }
  #lks-rc .lks-rq li:nth-child(2) { border-top: 1px dashed #ead9ad; }
  #lks-rc .lks-title { font-size: 16px !important; }
}
</style>
<div id="lks-rc" style="box-sizing: border-box; width: 100%; max-width: 100%; overflow: hidden; margin: 20px 0; border: 2px solid #1e3a8a; border-radius: 16px; background: #fff; box-shadow: 0 8px 24px rgba(30,58,138,.12); font-family: 'Pretendard', 'Noto Sans KR', sans-serif; color: #1f2937; line-height: 1.5;">
  <div class="lks-head" style="box-sizing: border-box; width: 100%; max-width: 100%; overflow: hidden; padding: 16px 20px; background: linear-gradient(135deg, #172554, #1e3a8a); color: #fff;">
    <span class="lks-live" style="display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.14); font-size: 12px; font-weight: 800; color: #fff;"><i style="display: inline-block;"></i>실시간</span>
    <b class="lks-title" style="color: #fff; font-size: 18px; font-weight: 800;">자료 요청 · 최근 댓글</b>
  </div>
  <div style="box-sizing: border-box; width: 100%; max-width: 100%; overflow: hidden; padding: 4px 20px 10px;">
    <div style="box-sizing: border-box; width: 100%; max-width: 100%; overflow: hidden; margin: 12px 0 4px; padding: 8px 12px; border-radius: 10px; background: #fff8e6; border: 1px solid #f3d48a; color: #6b4e00; font-size: 13px;">
      없는 분석노트도 <b>요청</b>하면 원장님이 만들어 <b>카톡으로</b> 보내 드려요. 요청은 <a href="https://data.likasuni.com/" style="color: #6b4e00; font-weight: 800; text-decoration: underline;">리카수니 자료실</a>에서 할 수 있어요.
    </div>
    <div class="lks-list" style="box-sizing: border-box; width: 100%; max-width: 100%; overflow: hidden;"><p style="color: #8a93a8; font-size: 14px;">불러오는 중...</p></div>
  </div>
</div>
<script>
(function () {
  var URL = 'https://iiyhmskvdjgstoikonwu.supabase.co', KEY = 'sb_publishable_JHxdlqWVh26TqD36jLflYQ_KoUmeuUj';
  var SITE = 'https://data.likasuni.com/';
  var OWNER_IDS = ['6363d675-9fa4-4539-af39-0028444f80f0']; // 원장님 카카오 계정
  var BOX = 'box-sizing: border-box; width: 100%; max-width: 100%; overflow: hidden;';
  var root = document.getElementById('lks-rc'); if (!root) return;
  // 가젯 제목 숨기기 (:has 를 모르는 옛 브라우저용)
  var w = root.closest ? root.closest('.widget') : null;
  if (w) for (var j = 0; j < w.children.length; j++) { var ch = w.children[j]; if (/^H[23]$/.test(ch.tagName) || ch.classList.contains('title')) ch.style.display = 'none'; }
  var list = root.querySelector('.lks-list');
  var shown = { rq: 6, cmt: 3 }, cache = [];
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function mask(n) { n = String(n || '회원').trim(); if (n === '리카수니' || n.length < 2) return n; return n.length === 2 ? n[0] + '*' : n[0] + new Array(n.length - 1).join('*') + n[n.length - 1]; }
  function ago(t) {
    var m = Math.floor((Date.now() - new Date(t)) / 60000);
    if (m < 1) return '방금'; if (m < 60) return m + '분 전';
    var h = Math.floor(m / 60); if (h < 24) return h + '시간 전';
    var d = new Date(t); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일';
  }
  function isReq(c) { return c.content.indexOf('[자료 요청]') === 0; }
  // 상태 3단계 (자료실 lib.js 와 같게): 진행 중(주황, '접수했어요') → 준비 완료(파랑, '준비됐어요') → 카톡 발송(초록, '보내 드렸어요')
  function isDone(c) { return /보내 드렸어요/.test(c.reply || ''); }
  function isReady(c) { return !isDone(c) && /준비됐어요/.test(c.reply || ''); }
  // '나도 받기': 자료실 요청 칸에 같은 회차·번호가 미리 골라져 있게
  function reqLink(c) {
    var t = c.content.replace('[자료 요청] ', '').replace(' 분석노트 부탁드려요.', ''), q = '';
    var m = t.match(/^(\d{4})년 (\d{1,2})월 고(\d) 영어 모의고사 (\d+)번$/);
    if (m) q = '?y=' + m[1] + '&m=' + m[2] + '&g=' + m[3] + '&n=' + m[4];
    else if ((m = t.match(/^(.+) (\d+)(?:강|회) (?:Gateway|(\d+)번)$/))) q = '?book=' + encodeURIComponent(m[1]) + '&unit=' + m[2] + '&n=' + (m[3] || 0);
    return SITE + c.page_key + '/' + q + '#note-req';
  }
  function short(c) { return c.content.replace('[자료 요청] ', '').replace(' 분석노트 부탁드려요.', '').replace(' 영어 모의고사', ''); }
  function reqItem(c) {
    var done = isDone(c), ready = isReady(c);
    var st = done ? ['카톡 발송', '#16a34a', '#a7dcb8', '#166534'] : ready ? ['준비 완료', '#2563eb', '#93b4f5', '#1d4ed8'] : ['진행 중', '#f59e0b', '#e5d3a1', '#7a4b00'];
    return '<li><span style="flex: none; padding: 2px 7px; border-radius: 6px; background: ' + st[1] + '; color: #fff; font-size: 11px; font-weight: 800;">' + st[0] + '</span>' +
      '<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.35;"><b style="font-weight: 700; overflow-wrap: anywhere;">' + esc(short(c)) + '</b>' +
      '<span style="font-size: 12px; color: #8a93a8;">' + esc(mask(c.author_name)) + ' · ' + ago(c.created_at) + '</span></span>' +
      (c.page_key ? '<a href="' + esc(reqLink(c)) + '"' + (ready ? ' title="요청하면 기다리지 않고 바로 카톡으로 받아요"' : '') + ' style="flex: none; padding: 3px 8px; border-radius: 6px; background: #fff; border: 1px solid ' + st[2] + '; font-size: 12px; font-weight: 700; color: ' + st[3] + ';">나도 받기</a>' : '') + '</li>';
  }
  function cmtItem(c) {
    var own = OWNER_IDS.indexOf(c.user_id) >= 0, nm = own ? '리카수니 원장' : mask(c.author_name);
    var tx = c.content.length > 80 ? c.content.slice(0, 80) + '...' : c.content;
    var rp = c.reply ? (c.reply.length > 70 ? c.reply.slice(0, 70) + '...' : c.reply) : '';
    return '<div style="display: flex; gap: 10px; padding: 11px 0; border-bottom: 1px solid #e5e7eb;">' +
      '<div style="flex: none; width: 34px; height: 34px; border-radius: 50%; background: ' + (own ? '#1e3a8a' : '#9aa5ba') + '; color: #fff; font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center;">' + (own ? '리' : esc(nm[0])) + '</div>' +
      '<div style="flex: 1; min-width: 0;">' +
      '<div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;"><b>' + esc(nm) + '</b>' + (own ? '<span style="padding: 2px 8px; border-radius: 999px; background: #ffc857; color: #4a3000; font-size: 11px; font-weight: 800;">운영자</span>' : '') + '<span style="font-size: 12px; color: #8a93a8;">' + ago(c.created_at) + '</span></div>' +
      '<div style="' + BOX + ' margin: 4px 0 0; font-size: 15px; overflow-wrap: anywhere;' + (own ? ' padding: 10px 12px; border-radius: 10px; background: #f3f6ff;' : '') + '">' + esc(tx) + '</div>' +
      (rp ? '<div style="' + BOX + ' margin-top: 6px; padding: 6px 10px; border-radius: 8px; background: #f3f6ff; font-size: 13px;"><b style="color: #1e3a8a; margin-right: 4px;">리카수니 원장</b>' + esc(rp) + '</div>' : '') +
      (c.page_key ? '<a href="' + SITE + esc(c.page_key) + '/#comments" style="display: inline-block; margin-top: 6px; padding: 3px 10px; border-radius: 8px; background: #eef1f6; font-size: 12px; font-weight: 700; color: #1e3a8a;">' + esc(c.page_title || '글 보기') + ' →</a>' : '') +
      '</div></div>';
  }
  function more(k, total) { return total > shown[k] ? '<button class="lks-more" data-k="' + k + '">더보기 (' + (total - shown[k]) + '개)</button>' : ''; }
  function render() {
    // 진행 중 → 준비 완료 → 카톡 발송 순서
    var rq = cache.filter(function (c) { return isReq(c) && !isDone(c) && !isReady(c); })
      .concat(cache.filter(function (c) { return isReq(c) && isReady(c); }), cache.filter(function (c) { return isReq(c) && isDone(c); })), cm = cache.filter(function (c) { return !isReq(c); });
    list.innerHTML =
      '<div style="' + BOX + ' margin: 12px 0 4px; border: 1px solid #f3d48a; border-radius: 12px; background: #fffbf0; padding: 10px 12px;">' +
        '<div style="margin: 0 0 6px; font-size: 15px; font-weight: 800; color: #7a4b00;">최근 자료 요청</div>' +
        '<ul class="lks-rq"' + (shown.rq > 6 ? ' style="max-height: 330px; overflow-y: auto;"' : '') + '>' + (rq.slice(0, shown.rq).map(reqItem).join('') || '<li style="font-size: 13px; color: #8a93a8;">필요한 분석노트를 요청해 주세요. 만들어서 카톡으로 보내 드려요.</li>') + '</ul>' + more('rq', rq.length) +
      '</div>' +
      '<div style="margin: 14px 0 0; font-size: 16px; font-weight: 800; color: #1e3a8a;">최근 댓글</div>' +
      '<div style="' + BOX + (shown.cmt > 3 ? ' max-height: 330px; overflow-y: auto;' : '') + '">' + (cm.slice(0, shown.cmt).map(cmtItem).join('') || '<p style="color: #8a93a8; font-size: 14px;">아직 댓글이 없어요. 자료실 페이지 아래에서 첫 댓글을 남겨 주세요!</p>') + '</div>' + more('cmt', cm.length);
    var bs = list.querySelectorAll('.lks-more');
    for (var i = 0; i < bs.length; i++) bs[i].onclick = function () { shown[this.getAttribute('data-k')] += 6; render(); };
  }
  function load() {
    fetch(URL + '/rest/v1/comments?select=id,user_id,author_name,content,created_at,reply,page_key,page_title&approved=eq.true&order=created_at.desc&limit=80',
      { headers: { apikey: KEY } })
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (d) { cache = Array.isArray(d) ? d : []; render(); })
      .catch(function () { if (!cache.length) render(); });
  }
  load();
  setInterval(function () { if (!document.hidden) load(); }, 30000);
})();
</script>
