<script>
(function(){
  var ds=Array.prototype.slice.call(document.querySelectorAll(".cgm-item > details"));
  function place(d){var r=d.querySelector("summary").getBoundingClientRect();d.style.setProperty("--cgm-top",Math.max(0,r.bottom+8)+"px");}
  ds.forEach(function(d){
    d.addEventListener("toggle",function(){if(d.open){ds.forEach(function(o){if(o!==d)o.open=false;});place(d);}});
    var c=d.querySelector(".cgm-close");if(c)c.addEventListener("click",function(){d.open=false;});
  });
  document.addEventListener("click",function(e){if(!e.target.closest(".cgm-item"))ds.forEach(function(d){d.open=false;});});
  document.addEventListener("keydown",function(e){if(e.key==="Escape")ds.forEach(function(d){d.open=false;});});
  window.addEventListener("resize",function(){ds.forEach(function(d){if(d.open)place(d);});});
  window.addEventListener("scroll",function(){ds.forEach(function(d){if(d.open)place(d);});},{passive:true});
})();
</script>

<script>
/* 수능특강 라이트 글 하단 이전/다음 버튼 주소 자동 보정 (기존 글을 위해 유지합니다) */
(function(){
  var BASE="https://www.likasuni.com/2026/10/";
  var EX={"2-1":"2026-2-1-ryanna","17-1":"2026-17-1-agnes-pockels","17-2":"2026-17-2-william-james","17-3":"2026-17-3-emotional-contagion","17-4":"2026-17-4-depth-perception","18-2":"2026-18-2-poetry-therapy","18-4":"2026-18-4-ethical-particularism","20-3":"2026-20-3_0812766301","22-gateway":"2026-22-gateway-2024-green-future"};
  function path(k,x){return BASE+(EX[k+"-"+x]||("2026-"+k+"-"+x))+".html";}
  function fix(){
    var as=document.querySelectorAll('a[href*="/2026/10/2026-"]'),i,m;
    for(i=0;i<as.length;i++){
      m=as[i].getAttribute("href").match(/^https?:\/\/www\.likasuni\.com\/2026\/10\/2026-(0?)(\d+)-(gateway|\d)(?:[-_][^\/]*)?\.html$/);
      if(m)as[i].setAttribute("href",path(m[2],m[3]));
    }
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",fix);else fix();
})();
</script>
