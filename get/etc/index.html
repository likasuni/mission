<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>기타 자료 받기 | 리카수니 자료실</title>
<style>body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#f5f7fb;color:#1f2937;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.c{background:#fff;border:1px solid #e3e7ef;border-radius:16px;padding:24px;max-width:420px;width:100%;text-align:center}
a.b{display:inline-block;margin-top:14px;padding:12px 20px;border-radius:12px;background:#1e3a8a;color:#fff;font-weight:800;text-decoration:none}</style></head>
<body><div class="c"><b>리카수니 자료실 · 기타 자료</b><p>자료가 있는 구글 드라이브로 이동하고 있어요...</p><a class="b" id="go" href="#">자료 열기</a></div>
<script>
// 카톡 버튼은 카카오에 등록한 도메인(data.likasuni.com)만 열 수 있어서, 여기서 구글 드라이브로 넘겨요 (함수 etc-notify)
// ?u= 는 구글 드라이브·문서 주소만 받아요 (다른 사이트로 넘기는 데 쓰이지 않게). 기타자료 폴더 파일은 /get/?t= 로 보내요
var to = '';
try { var u = new URL(new URLSearchParams(location.search).get('u') || ''); if (u.protocol === 'https:' && /^(drive|docs)\.google\.com$/.test(u.hostname)) to = u.href; } catch (e) {}
if (to) { document.getElementById('go').href = to; location.replace(to); }
else { document.querySelector('.c p').textContent = '잘못된 링크예요. 받은 카톡 링크를 다시 확인해 주세요.'; document.getElementById('go').href = '/notes/'; document.getElementById('go').textContent = '자료 요청으로 가기'; }
</script></body></html>
