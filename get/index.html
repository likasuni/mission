<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>분석노트 받기 | 리카수니 자료실</title>
<meta property="og:title" content="리카수니 분석노트가 도착했어요">
<meta property="og:description" content="승인된 번호별 분석노트 PDF를 받아보세요. (승인 후 7일 동안)">
<meta property="og:image" content="https://data.likasuni.com/og.png">
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/style.css?v=4">
</head>
<body>
<header class="top"><div class="top-in"><a class="brand" href="/">리카수니 <b>자료실</b></a></div></header>
<main class="wrap"><div class="card" style="text-align:center">
<h2>📘 분석노트 받기</h2>
<p class="muted" id="msg">파일을 여는 중이에요...</p>
<p><a class="btn btn-gold" id="go" href="#">PDF 열기</a></p>
<p class="meta">파일이 열리지 않으면 위 버튼을 눌러주세요. 링크는 승인 후 7일 동안만 사용할 수 있어요.</p>
</div></main>
<script>
const t = new URLSearchParams(location.search).get('t') || '';
const go = document.getElementById('go');
if (!/^[a-f0-9]{32}$/.test(t)) {
  document.getElementById('msg').textContent = '잘못된 링크예요. 받은 링크를 다시 확인해 주세요.';
  go.style.display = 'none';
} else {
  go.href = 'https://iiyhmskvdjgstoikonwu.supabase.co/functions/v1/note-download?t=' + t;
  setTimeout(() => location.replace(go.href), 600);
}
</script>
</body>
</html>
