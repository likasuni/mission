<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>분석노트 받기 | 리카수니 자료실</title>
<meta property="og:title" content="리카수니 분석노트가 도착했어요">
<meta property="og:description" content="요청하신 분석노트 PDF를 받아보세요. (24시간 동안)">
<meta property="og:image" content="https://data.likasuni.com/og.png">
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/style.css?v=4">
</head>
<body>
<header class="top"><div class="top-in"><a class="brand" href="/">리카수니 <b>자료실</b></a></div></header>
<main class="wrap"><div class="card" style="text-align:center">
<h2>분석노트 받기</h2>
<p class="muted" id="msg">파일을 여는 중이에요...</p>
<p><a class="btn btn-gold" id="go" href="#">PDF 열기</a></p>
<p class="meta">파일이 열리지 않으면 위 버튼을 눌러주세요. 링크는 받은 뒤 24시간 동안만 열 수 있어요.</p>
</div></main>
<script>
const qs = new URLSearchParams(location.search);
const t = qs.get('t') || '', err = qs.get('e');
const go = document.getElementById('go');
const ERR = {
  bad: '잘못된 링크예요. 받은 링크를 다시 확인해 주세요.',
  notfound: '링크를 찾을 수 없어요. 자료실에서 다시 요청해 주세요.',
  expired: '링크 사용 기간(24시간)이 지났어요. 자료실에서 다시 요청해 주세요.',
  fail: '파일을 가져오지 못했어요. 잠시 후 다시 시도해 주세요.'
};
if (err) {
  document.getElementById('msg').innerHTML = (ERR[err] || ERR.fail) + '<br><a href="/notes/">분석노트 요청하러 가기 →</a>';
  go.style.display = 'none';
} else if (!/^[a-f0-9]{32}$/.test(t)) {
  document.getElementById('msg').textContent = '잘못된 링크예요. 받은 링크를 다시 확인해 주세요.';
  go.style.display = 'none';
} else {
  go.href = 'https://iiyhmskvdjgstoikonwu.supabase.co/functions/v1/note-download?t=' + t;
  setTimeout(() => location.replace(go.href), 600);
}
</script>
</body>
</html>
