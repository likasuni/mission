<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>관리자 | 리카수니 자료실</title>
<link rel="stylesheet" href="/style.css?v=4">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="/common.js"></script>
</head>
<body>

<header class="top">
  <div class="top-in">
    <a class="brand" href="/">리카수니 <b>관리자</b></a>
    <div class="auth" id="auth"></div>
  </div>
</header>

<main class="wrap" id="main"><p class="muted">불러오는 중...</p></main>

<footer><a href="/">← 자료실로 돌아가기</a></footer>

<script>
let user = null;
let current = 'comments';

/* ---------- 방문자 (2026-11-20~, SQL _tools/sql/2026-11-20_visits.sql) ---------- */
let vsDays = 14;
const VS_SRC = { naver: '네이버', google: '구글', daum: '다음', kakao: '카카오톡', blog: '리카수니 블로그', bing: 'Bing', direct: '주소 직접·앱', inside: '자료실 안', other: '기타 사이트' };
const vsPage = p => p === '/' ? '첫 화면' : p.replace(/^\/|\/$/g, '')
  .replace(/^moe\/go(\d)\/(\d{4})-(\d{2})\/eng\/?(.*)$/, (m, g, y, mo, r) => `${y}년 ${+mo}월 고${g} 영어${r ? ' ' + r.replace(/\/$/, '') + '번' : ''}`)
  .replace(/^suneung\/(\d{4})\/eng\/?(.*)$/, (m, y, r) => `${y}학년도 수능 영어${r ? ' ' + r + '번' : ''}`)
  .replace(/^notes$/, '자료 요청').replace(/^english$/, '영어 PDF 자료받기').replace(/^get$/, '받기 페이지(카톡 링크)')
  .replace(/^posts$/, '분석노트 전자책').replace(/^exams$/, '전과목 기출');
async function tabVisits() {
  const { data, error } = await sb.rpc('admin_visits', { p_days: vsDays });
  if (error) return $('#panel').innerHTML = `<p class="muted">오류: ${esc(error.message)}</p>`;
  const days = data.days || [], today = days[0] || { users: 0, views: 0 }, yday = days[1] || { users: 0, views: 0 };
  const sum = (a, k) => a.reduce((s, d) => s + (+d[k] || 0), 0);
  const w7 = days.slice(0, 7);
  const max = Math.max(1, ...days.map(d => d.users));
  const stat = (n, l) => `<div style="flex:1 1 120px;padding:12px;border-radius:12px;background:#f3f6fb"><b style="font-size:1.4rem;color:#142943">${n.toLocaleString()}</b><br><span class="meta">${l}</span></div>`;
  const wk = d => '일월화수목금토'[new Date(d + 'T00:00:00+09:00').getDay()];
  const bars = days.map(d => `<div style="display:flex;align-items:center;gap:8px;margin:3px 0;font-size:.88rem">
      <span style="width:62px;color:#667">${d.day.slice(5).replace('-', '.')} ${wk(d.day)}</span>
      <span style="flex:1;background:#eef2f8;border-radius:6px;height:18px;overflow:hidden"><span style="display:block;height:100%;width:${Math.round(d.users * 100 / max)}%;background:#2b4c7e"></span></span>
      <span style="width:120px;text-align:right"><b>${d.users}</b>명 · ${d.views}쪽</span></div>`).join('');
  const sTot = (data.srcs || []).reduce((s, x) => s + x.n, 0);
  const srcs = (data.srcs || []).map(x => `<li>${VS_SRC[x.src] || esc(x.src)} <b>${x.n}</b>명 <span class="meta">${Math.round(x.n * 100 / (sTot || 1))}%</span></li>`).join('');
  const pages = arr => (arr || []).map(x => `<li><a href="${esc(x.path)}" target="_blank" rel="noopener">${esc(vsPage(x.path))}</a> <b>${x.n}</b></li>`).join('') || '<li class="meta">아직 기록이 없어요</li>';
  const dbtn = (n, l) => `<button class="btn btn-sm ${vsDays === n ? 'btn-navy' : 'btn-line'}" onclick="vsDays=${n};tabVisits()">${l}</button>`;
  $('#panel').innerHTML = `
    <div class="card">
      <div class="row" style="gap:10px;flex-wrap:wrap">
        ${stat(today.users, '오늘 방문자')}${stat(yday.users, '어제 방문자')}${stat(sum(w7, 'users'), '최근 7일 방문자')}${stat(sum(w7, 'views'), '최근 7일 페이지 조회')}
      </div>
      <p class="meta" style="margin:10px 0 0">2026-11-20부터 기록. 같은 사람(같은 브라우저)은 하루 한 번만 세고, 검색 로봇과 이 관리자 브라우저는 빼요. 광고 차단·구글 애널리틱스와 세는 방식이 달라 숫자가 조금 달라요.</p>
    </div>
    <div class="card"><div class="row between" style="flex-wrap:wrap;gap:8px"><h3 style="margin:0">날짜별 방문자</h3><div>${dbtn(14, '14일')} ${dbtn(30, '30일')} ${dbtn(90, '90일')}</div></div>${bars}</div>
    <div class="card"><h3 style="margin-top:0">어디서 왔나 <small class="meta">최근 7일, 그날 처음 들어온 곳</small></h3><ul>${srcs || '<li class="meta">아직 기록이 없어요</li>'}</ul></div>
    <div class="card"><h3 style="margin-top:0">오늘 많이 본 페이지</h3><ol>${pages(data.today_pages)}</ol></div>
    <div class="card"><h3 style="margin-top:0">최근 7일 많이 본 페이지</h3><ol>${pages(data.pages)}</ol></div>`;
}

/* ---------- 탭 ---------- */
function shell() {
  $('#main').innerHTML = `
    <div class="tabs">
      <button class="tab" data-t="comments" onclick="showTab('comments')">댓글 <span id="n-comments"></span></button>
      <button class="tab" data-t="notes" onclick="showTab('notes')">분석노트 요청 <span id="n-notes"></span></button>
      <button class="tab" data-t="requests" onclick="showTab('requests')">자료 요청 <span id="n-requests"></span></button>
      <button class="tab" data-t="materials" onclick="showTab('materials')">자료 관리</button>
      <button class="tab" data-t="naesin" onclick="showTab('naesin')">학원생 승인 <span id="n-naesin"></span></button>
      <button class="tab" data-t="people" onclick="showTab('people')">요청자</button>
      <button class="tab" data-t="visits" onclick="showTab('visits')">방문자</button>
    </div>
    <section id="panel"></section>`;
}

async function showTab(t) {
  current = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  $('#panel').innerHTML = '<p class="muted">불러오는 중...</p>';
  if (t === 'comments') await tabComments();
  if (t === 'requests') await tabRequests();
  if (t === 'materials') await tabMaterials();
  if (t === 'notes') await tabNotes();
  if (t === 'naesin') await tabNaesin();
  if (t === 'people') await tabPeople();
  if (t === 'visits') await tabVisits();
  updateBadges();
}

async function updateBadges() {
  const c = await sb.from('comments').select('id', { count: 'exact', head: true }).eq('approved', false);
  const r = await sb.from('requests').select('id', { count: 'exact', head: true }).eq('status', 'pending');
  $('#n-comments').textContent = c.count ? `(${c.count})` : '';
  $('#n-requests').textContent = r.count ? `(${r.count})` : '';
  const n = await sb.from('note_orders').select('id', { count: 'exact', head: true }).eq('status', 'missing');
  $('#n-notes').textContent = n.count ? `(자료 없음 ${n.count})` : '';
  const ns = await sb.from('naesin_members').select('user_id', { count: 'exact', head: true }).eq('status', 'pending');
  $('#n-naesin').textContent = ns.count ? `(${ns.count})` : '';
}

/* ---------- 댓글 (한눈에 보기 · 승인 · 답글 · 회원별 모아보기) ---------- */
let cFilter = 'all', cUser = null;
async function tabComments() {
  let q = sb.from('comments')
    .select('id,author_name,content,created_at,approved,reply,user_id,page_key,page_title,secret,pinned,ask_status,ask_link,materials(title)')
    .order('created_at', { ascending: false }).limit(200);
  if (cFilter === 'pending') q = q.eq('approved', false);
  if (cFilter === 'noreply') q = q.is('reply', null);
  if (cFilter === 'talk') q = q.eq('page_key', 'talk');
  if (cFilter === 'etc') q = q.like('content', '[자료 요청] 기타 ·%');  // 기타 자료 요청 (카톡 보내기 버튼)
  if (cUser) q = q.eq('user_id', cUser.id);
  const { data, error } = await q;
  if (error) return $('#panel').innerHTML = `<p class="muted">오류: ${esc(error.message)}</p>`;
  const pend = data.filter(c => !c.approved).length;
  const fb = (k, label) => `<button class="btn btn-sm ${cFilter === k ? 'btn-navy' : 'btn-line'}" onclick="setCFilter('${k}')">${label}</button>`;
  $('#panel').innerHTML = `
    <div class="card">
      <div class="row between" style="flex-wrap:wrap;gap:8px">
        <div class="row" style="gap:6px;flex-wrap:wrap">${fb('all', '전체 댓글')}${fb('pending', '승인 대기')}${fb('noreply', '답글 안 단 댓글')}${fb('talk', '신간교재 요청')} ${fb('etc', '기타 자료 요청')}</div>
        ${pend ? `<button class="btn btn-gold btn-sm" onclick="approveAll()">대기 ${pend}개 전체 승인</button>` : ''}
      </div>
      ${cUser ? `<p class="mt"><b>${esc(cUser.name)}</b> 님의 댓글만 보는 중 · <a href="#" onclick="cUser=null;showTab('comments');return false">전체로 돌아가기</a></p>` : '<p class="meta mt">회원 이름을 누르면 그 회원이 쓴 댓글만 모아 볼 수 있어요.</p>'}
    </div>
    ${data.length ? data.map(c => `
      <div class="card">
        <div class="row" style="flex-wrap:wrap;gap:6px">
          <a href="#" onclick="cUser={id:'${c.user_id}',name:${esc(JSON.stringify(c.author_name || '회원'))}};showTab('comments');return false"><strong>${esc(c.author_name || '익명')}</strong></a>
          <span class="tag" style="background:${c.approved ? '#e8f7ee;color:#166534' : '#fff4e0;color:#9a5b00'}">${c.approved ? '공개' : '승인 대기'}</span>
          <span class="tag">${c.page_key ? `<a href="${c.page_key === 'talk' ? '/#talk' : '/' + esc(c.page_key) + '/'}" target="_blank">${esc(c.page_title || c.page_key)}</a>` : esc(c.materials?.title || '')}</span>
          ${c.secret ? '<span class="tag" style="background:#f1f5f9;color:#475569">🔒 비밀글</span>' : ''}
          ${c.pinned ? '<span class="tag" style="background:#fff4e0;color:#9a5b00">📌 고정 공지</span>' : ''}
          <span class="meta">${fmtDate(c.created_at)}</span>
        </div>
        <p class="body" style="white-space:pre-wrap;margin:8px 0">${esc(c.content)}</p>
        ${c.reply ? `<div class="reply"><b>내 답글</b><br>${esc(c.reply)}</div>` : ''}
        <div id="rp-${c.id}" style="display:none" class="mt">
          <textarea id="rt-${c.id}" rows="3" style="width:100%" placeholder="답글을 입력하세요">${esc(c.reply || '')}</textarea>
          <div class="row mt"><button class="btn btn-navy btn-sm" onclick="saveReply(${c.id})">답글 저장${c.approved ? '' : ' + 승인'}</button></div>
        </div>
        <div class="row mt" style="gap:6px">
          ${c.approved ? '' : `<button class="btn btn-gold btn-sm" onclick="approve(${c.id})">승인</button>`}
          <button class="btn btn-line btn-sm" onclick="document.getElementById('rp-${c.id}').style.display=''">${c.reply ? '답글 수정' : '답글 달기'}</button>
          ${c.page_key === 'talk' ? `<button class="btn btn-line btn-sm" onclick="togglePin(${c.id}, ${!c.pinned})">${c.pinned ? '고정 해제' : '📌 공지 고정'}</button>` : ''}
          <button class="btn btn-danger btn-sm" onclick="removeComment(${c.id})">삭제</button>
        </div>
        ${c.page_key === 'talk' ? `<div class="mt" style="padding:10px;border:1px dashed #b9c8ea;border-radius:10px;background:#f5f8ff">
          <b>자료 문의 상태</b> <span class="meta">지금: ${c.ask_status === 'added' ? '✅ 추가했어요' : c.ask_status === 'no' ? '어려워요' : c.reply ? '답변 완료' : '검토 중'} · 답글과 함께 학생에게 보여요</span>
          <div class="row mt" style="gap:6px;flex-wrap:wrap"><input id="al-${c.id}" value="${esc(c.ask_link || '/notes/')}" placeholder="요청하러 가기 주소 (자료실 안 경로, 예: /notes/)" style="flex:1 1 220px">
          <button class="btn btn-gold btn-sm" onclick="askSet(${c.id}, 'added')">✅ 추가했어요</button>
          <button class="btn btn-line btn-sm" onclick="askSet(${c.id}, 'no')">어려워요</button>
          ${c.ask_status ? `<button class="btn btn-line btn-sm" onclick="askSet(${c.id}, null)">상태 지우기</button>` : ''}</div></div>` : ''}
        ${c.content.startsWith('[자료 요청] 기타 ·') ? `<div class="mt" style="padding:10px;border:1px dashed #f3d48a;border-radius:10px;background:#fffbf0">
          <b>기타 자료 요청</b> <span class="meta">PDF 를 <a href="https://drive.google.com/drive/folders/1FryHlXrnXc7gzP8e3xQrM-TBR6L-KkXY" target="_blank" rel="noopener"><b>기타자료 드라이브 폴더</b></a>(비공개)에 올리고 <b>자료 고르기</b>에서 파일을 고른 뒤 누르면, 요청한 학생에게 <b>그 파일 하나만</b> 여는 링크(7일)를 카톡으로 보내고 답글을 '보내 드렸어요'로 바꿔요.</span>
          <div class="row mt" style="gap:6px;flex-wrap:wrap"><select id="ef-${c.id}" style="flex:1 1 260px" onfocus="etcFiles(${c.id})"><option value="">자료 고르기 (기타자료 폴더)</option></select>
          <input id="em-${c.id}" maxlength="120" placeholder="한 줄 메시지 (선택)" style="flex:1 1 220px"></div>
          <div class="row mt" style="gap:6px;flex-wrap:wrap"><input id="el-${c.id}" placeholder="또는 다른 링크 직접 넣기 (선택)" style="flex:1 1 220px">
          <button class="btn btn-gold btn-sm" onclick="etcSend(${c.id})">준비 완료 · 카톡 보내기</button>
          ${/제공이 어려워요/.test(c.reply || '') ? '<span class="meta"><b>제공 어려움</b> 처리됨 · 공개 목록에서 빠졌어요</span>' : /보내 드렸어요/.test(c.reply || '') ? '' : `<button class="btn btn-line btn-sm" onclick="etcDecline(${c.id})">제공 어려워요</button>`}</div></div>` : ''}
      </div>`).join('') : '<div class="card"><p class="muted">해당하는 댓글이 없어요.</p></div>'}`;
}
function setCFilter(k) { cFilter = k; showTab('comments'); }

// 자료 문의(옛 소통하기) 상태: 'added' = 추가했어요(+ 요청하러 가기 주소), 'no' = 어려워요, null = 지우기.
// 답글이 비어 있으면 기본 답글도 함께 달아요 (고치려면 '답글 수정')
const ASK_REPLY = { added: '문의하신 자료를 요청 목록에 추가했어요. 아래 버튼으로 요청해 주세요.', no: '문의 감사해요. 이 자료는 지금은 준비하기 어려워요. 자료실의 모의고사·부교재 분석노트는 무료로 받을 수 있어요.' };
async function askSet(id, status) {
  const link = (document.getElementById('al-' + id)?.value || '').trim();
  if (status === 'added' && !/^\/[^/]/.test(link)) return toast('요청하러 가기 주소는 /notes/ 처럼 자료실 안 경로로 넣어 주세요.');
  const cur = document.getElementById('rt-' + id)?.value.trim();
  const upd = { ask_status: status, ask_link: status === 'added' ? link : null, approved: true };
  if (status && !cur) Object.assign(upd, { reply: ASK_REPLY[status], replied_at: new Date().toISOString() });
  const { error } = await sb.from('comments').update(upd).eq('id', id);
  if (error) return toast('오류: ' + error.message);
  toast(status === 'added' ? '추가했어요로 표시했어요.' : status === 'no' ? '어려워요로 표시했어요.' : '상태를 지웠어요.');
  showTab('comments');
}
// 소통하기: 공지 고정/해제 (해제하면 날짜 순서로 내려감)
async function togglePin(id, on) {
  const { error } = await sb.from('comments').update({ pinned: on }).eq('id', id);
  if (error) return toast('오류: ' + error.message);
  toast(on ? '소통하기 맨 위에 고정했어요.' : '고정을 풀었어요.');
  showTab('comments');
}
// 기타 자료 요청: 요청한 학생에게 카톡 (함수 etc-notify)
// 자료 고르기: 기타자료 폴더 PDF 목록 (칸을 누를 때 한 번 불러옴, 같은 화면의 다른 요청 칸도 같은 목록)
let etcList = null;
async function etcFiles(id) {
  const sel = document.getElementById('ef-' + id);
  if (sel.dataset.loaded) return;
  sel.dataset.loaded = '1';
  if (!etcList) {
    sel.options[0].text = '불러오는 중...';
    const { data: { session } } = await sb.auth.getSession();
    const res = await fetch(`${SUPABASE_URL}/functions/v1/etc-notify`, { method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: `Bearer ${session.access_token}` }, body: JSON.stringify({ action: 'list' }) });
    const r = await res.json().catch(() => ({}));
    if (!res.ok) { sel.dataset.loaded = ''; sel.options[0].text = '자료 고르기 (기타자료 폴더)'; return toast('오류: ' + (r.error || res.status)); }
    if (!r.files.length) { sel.dataset.loaded = ''; sel.options[0].text = '자료 고르기 (기타자료 폴더)'; return toast(r.hint || '폴더에 PDF 가 없어요.'); }
    etcList = r.files.sort((a, b) => a.name.localeCompare(b.name, 'ko'));
  }
  sel.innerHTML = '<option value="">자료 고르기 (기타자료 폴더)</option>' + etcList.map(f => `<option value="${esc(f.id)}">${esc(f.name)}</option>`).join('');
}
async function etcSend(id) {
  const file_id = document.getElementById('ef-' + id).value, link = document.getElementById('el-' + id).value.trim();
  if (!file_id && !link) return toast('보낼 자료를 골라 주세요.');
  const { data: { session } } = await sb.auth.getSession();
  const res = await fetch(`${SUPABASE_URL}/functions/v1/etc-notify`, { method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: `Bearer ${session.access_token}` },
    body: JSON.stringify({ id, file_id, link, memo: document.getElementById('em-' + id).value }) });
  const r = await res.json().catch(() => ({}));
  if (!res.ok) return toast('오류: ' + (r.error || res.status));
  toast(r.sent ? '카톡으로 보냈어요!' : `카톡을 못 보냈어요 (${{ no_token: '카카오 연결 없음', no_consent: '카톡 동의 안 함', fail: '발송 실패' }[r.why] || r.why}). 답글로 '준비됐어요' 안내를 남겼어요.`);
  showTab('comments');
}
// 기타 자료 요청: 제공이 어려운 자료 → 답글을 달고 첫 화면·블로그 요청 목록에서 뺌 (카톡은 보내지 않음, 답글 문구 '제공이 어려워요'로 구분)

/* ---------- 요청자 (회원별 요청 기록, 2026-11-17~) ----------
   서버 함수 admin_requesters() — 관리자만, 이메일·전화번호 없이 닉네임만. */
let ppData = null, ppSort = 'req', ppOnly = 'req';
const PP_ROLE = { student: ['학생', '#1e3a8a'], teacher: ['선생님·강사', '#b45309'], parent: ['학부모', '#2f855a'] };
const ppGrade = o => o.k === 'book' ? '부교재' : o.q && +o.q.m === 0 && o.q.y ? '수능' : (o.q && o.q.g ? '고' + o.q.g : '기타');
const ppAgo = t => { if (!t) return '-'; const d = Math.floor((Date.now() - new Date(t)) / 864e5); return d <= 0 ? '오늘' : d + '일 전'; };
async function tabPeople() {
  if (!ppData) {
    const { data, error } = await sb.rpc('admin_requesters');
    if (error) return $('#panel').innerHTML = `<p class="muted">오류: ${esc(error.message)}</p>`;
    ppData = (data || []).filter(m => !m.admin);
  }
  const all = ppData, req = all.filter(m => m.orders.length);
  const pct = (a, b) => b ? Math.round(a * 100 / b) + '%' : '-';
  const week = t => t && Date.now() - new Date(t) < 7 * 864e5;
  // 학년별: 요청 건수 / 요청한 사람 수
  const gr = {};
  for (const m of req) {
    const seen = new Set();
    for (const o of m.orders) { const g = ppGrade(o); gr[g] = gr[g] || { n: 0, p: 0 }; gr[g].n++; if (!seen.has(g)) { seen.add(g); gr[g].p++; } }
  }
  const gOrder = ['고1', '고2', '고3', '수능', '부교재', '기타'].filter(g => gr[g]);
  const gTotal = gOrder.reduce((s, g) => s + gr[g].n, 0);
  const rc = k => all.filter(m => m.role === k).length;
  const stat = (n, l) => `<div style="flex:1 1 120px;padding:12px;border-radius:12px;background:#f3f6fb"><b style="font-size:1.4rem;color:#142943">${n}</b><br><span class="meta">${l}</span></div>`;
  // 목록
  let list = ppOnly === 'req' ? req : ppOnly === 'none' ? all.filter(m => !m.orders.length) : all;
  const key = { req: m => m.orders.length, recent: m => +new Date(m.last_in || 0), gone: m => -new Date(m.last_req || m.last_in || 0), days: m => m.days };
  list = [...list].sort((a, b) => key[ppSort](b) - key[ppSort](a));
  const sbtn = (k, l) => `<button class="btn btn-sm ${ppSort === k ? 'btn-navy' : 'btn-line'}" onclick="ppSort='${k}';tabPeople()">${l}</button>`;
  const obtn = (k, l) => `<button class="btn btn-sm ${ppOnly === k ? 'btn-navy' : 'btn-line'}" onclick="ppOnly='${k}';tabPeople()">${l}</button>`;
  const row = m => {
    const r = PP_ROLE[m.role];
    const gs = {}; m.orders.forEach(o => { const g = ppGrade(o); gs[g] = (gs[g] || 0) + 1; });
    const main = Object.entries(gs).sort((a, b) => b[1] - a[1]).map(([g, n]) => `${g} ${n}`).join(' · ');
    return `<details class="card" style="padding:12px 16px">
      <summary style="cursor:pointer;list-style:none">
        <div class="row between" style="gap:8px;flex-wrap:wrap">
          <div><strong>${esc(m.name)}</strong>
            ${r ? `<span style="font-size:.78rem;font-weight:700;color:${r[1]}">[${r[0]}]</span>` : '<span class="meta">[구분 없음]</span>'}
            ${m.academy ? '<span class="tag ok">학원생</span>' : ''}
            <span class="meta">${m.via === 'kakao' ? '카카오' : m.via === 'google' ? '구글' : esc(m.via || '')}</span><br>
            <span class="meta">요청 <b>${m.orders.length}</b>건 · ${m.days}일 · ${main || '요청 없음'}${m.comments ? ' · 댓글 ' + m.comments : ''}</span></div>
          <div class="meta">마지막 방문 ${ppAgo(m.last_in)}<br>가입 ${fmtDate(m.joined)}</div>
        </div></summary>
      ${m.orders.length ? `<ul style="margin:10px 0 0;padding-left:18px;font-size:.9rem">${m.orders.map(o =>
        `<li>${esc(o.l || '')} <span class="meta">${fmtDate(o.t)} · ${{ missing: '만드는 중', resolved: '받을 수 있음', sent: '받음', expired: '기한 지남', done: '처리됨' }[o.s] || esc(o.s)}</span></li>`).join('')}</ul>`
        : '<p class="meta" style="margin:8px 0 0">아직 요청한 자료가 없어요.</p>'}
    </details>`;
  };
  $('#panel').innerHTML = `
    <div class="card"><h2>요청자 한눈에 보기 <span class="meta">관리자 계정 빼고</span></h2>
      <div class="row" style="flex-wrap:wrap;gap:8px;margin:8px 0">
        ${stat(all.length + '명', '가입 회원')}
        ${stat(all.filter(m => week(m.last_in)).length + '명', '최근 7일 방문')}
        ${stat(req.length + '명', `요청한 회원 (${pct(req.length, all.length)})`)}
        ${stat(req.filter(m => m.days >= 2).length + '명', `다른 날 다시 요청 (${pct(req.filter(m => m.days >= 2).length, req.length)})`)}
      </div>
      <p style="margin:12px 0 4px"><b>학년별 요청</b> <span class="meta">건수 · 요청한 사람</span></p>
      ${gOrder.map(g => `<div class="row" style="gap:8px;align-items:center;margin:4px 0">
        <span style="width:52px">${g}</span>
        <div style="flex:1;background:#eef1f6;border-radius:6px;height:14px;overflow:hidden"><div style="width:${gr[g].n * 100 / gTotal}%;height:100%;background:#142943"></div></div>
        <span class="meta" style="width:110px;text-align:right">${gr[g].n}건 · ${gr[g].p}명</span></div>`).join('')}
      <p style="margin:12px 0 4px"><b>회원 구분</b> <span class="meta">첫 요청 때 고름 (11-15~)</span></p>
      <p class="meta" style="margin:0">학생 ${rc('student')} · 선생님·강사 ${rc('teacher')} · 학부모 ${rc('parent')} · 아직 안 고름 ${all.length - rc('student') - rc('teacher') - rc('parent')}</p>
      <p class="meta" style="margin:10px 0 0">사는 지역은 모아지지 않아서 알 수 없어요. 이메일·전화번호는 보여 주지 않아요.</p>
    </div>
    <div class="card"><div class="row" style="flex-wrap:wrap;gap:6px">
      ${obtn('req', `요청한 회원 ${req.length}`)} ${obtn('none', `요청 없음 ${all.length - req.length}`)} ${obtn('all', `전체 ${all.length}`)}
    </div><div class="row" style="flex-wrap:wrap;gap:6px;margin-top:8px">
      <span class="meta">정렬</span> ${sbtn('req', '요청 많은 순')} ${sbtn('days', '자주 온 순')} ${sbtn('recent', '최근 방문 순')} ${sbtn('gone', '오래 안 온 순')}
    </div><p class="meta" style="margin:8px 0 0">이름을 누르면 요청한 자료가 펼쳐져요.</p></div>
    ${list.map(row).join('') || '<div class="card"><p class="muted">해당하는 회원이 없어요.</p></div>'}`;
}

/* ---------- 분석노트 요청 (카톡 자동 발송 기록) ---------- */
// 상태: missing = 만들어야 함 · resolved = 드라이브에 올림(학생 수령 대기) · sent = 보냄 · done = 기다리던 요청이 처리됨
// 자동 카톡을 못 보낸 이유 (note-deliver 가 기록)
const KAKAO_ISSUE = { no_consent: '카톡 동의 안 함', no_token: '카카오 연결 없음', fail: '카톡 발송 실패' };
async function tabNotes() {
  const [{ data, error }, { data: cm }, { data: mr }] = await Promise.all([
    sb.from('note_orders')
      .select('id,user_id,author_name,label,status,file_name,kakao_sent,expires_at,created_at,query,kakao_issue')
      .order('created_at', { ascending: false }).limit(500),
    sb.from('comments').select('user_id,content,reply,replied_at')
      .like('content', '[자료 요청]%').order('created_at', { ascending: false }).limit(1000),
    sb.from('member_roles').select('user_id,role').limit(5000), // 회원 구분 (2026-11-15~, 첫 요청 때 한 번 고름)
  ]);
  const ROLE = { student: '학생', teacher: '선생님·강사', parent: '학부모' };
  const roleOf = new Map((mr || []).map(r => [r.user_id, r.role]));
  const rtag = uid => roleOf.has(uid) ? ` <span style="font-size:.78rem;font-weight:700;color:${roleOf.get(uid) === 'teacher' ? '#b45309' : roleOf.get(uid) === 'parent' ? '#2f855a' : '#1e3a8a'}">[${ROLE[roleOf.get(uid)]}]</span>` : '';
  const rcnt = k => (mr || []).filter(r => r.role === k).length;
  if (error) return $('#panel').innerHTML = `<p class="muted">오류: ${esc(error.message)}</p>`;
  const missing = data.filter(o => o.status === 'missing');
  const waiting = data.filter(o => o.status === 'resolved');
  const sent = data.filter(o => o.status === 'sent');
  // 같은 자료는 한 줄로 묶어 요청한 학생 이름을 함께 (오래된 요청 순)
  const group = list => {
    const m = new Map();
    for (const o of [...list].reverse()) {
      const g = m.get(o.label) || { label: o.label, ids: [], names: [], at: o.created_at };
      g.ids.push(o.id); g.names.push(esc(o.author_name || '회원') + rtag(o.user_id) + (KAKAO_ISSUE[o.kakao_issue] ? ` <b style="color:#c2410c">(${KAKAO_ISSUE[o.kakao_issue]})</b>` : ''));
      if (o.kakao_issue) g.issue = true;
      m.set(o.label, g);
    }
    return [...m.values()];
  };

  // 완료한 자료 (최근 7일): 기다리던 요청(missing)이 드라이브에 올라와 resolved/done 이 된 것
  // 완료 시각 = 자동 카톡 발송 시각 → '준비됐어요/보내 드렸어요' 답글 시각 → 요청 시각 중 먼저 있는 것
  const key = (u, l) => u + '|' + l;
  const autoAt = new Map(), replyAt = new Map();
  for (const o of sent) if (o.query && o.query.auto) {
    const k = key(o.user_id, o.label);
    if (!autoAt.has(k) || o.created_at < autoAt.get(k)) autoAt.set(k, o.created_at);
  }
  for (const c of cm || []) {
    if (!c.replied_at || !/준비됐어요|보내 드렸어요/.test(c.reply || '')) continue;
    const l = (c.content.match(/^\[자료 요청\] (.+) 부탁드려요\.$/) || [])[1];
    if (!l) continue;
    const k = key(c.user_id, l);
    if (!replyAt.has(k) || c.replied_at < replyAt.get(k)) replyAt.set(k, c.replied_at);
  }
  const since = Date.now() - 7 * 86400e3;
  const doneMap = new Map();
  for (const o of data.filter(o => o.status === 'resolved' || o.status === 'done')) {
    const k = key(o.user_id, o.label);
    const at = autoAt.get(k) || replyAt.get(k) || o.created_at;
    if (new Date(at).getTime() < since) continue;
    const g = doneMap.get(o.label) || { label: o.label, at, n: 0 };
    if (at < g.at) g.at = at;
    g.n++; doneMap.set(o.label, g);
  }
  const done = [...doneMap.values()].sort((x, y) => (x.at < y.at ? 1 : -1));
  const md = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()}`; };

  const gm = group(missing), gw = group(waiting);
  const issues = waiting.filter(o => KAKAO_ISSUE[o.kakao_issue]);
  const short = l => esc(String(l || '').replace(' 영어 모의고사', '').replace(/ 분석노트$/, ''));
  const todoRow = g => `
    <div class="nc-item"><div class="nc-main"><strong>${short(g.label)}</strong>
      <span class="meta">${md(g.at)} 첫 요청</span></div>
      <span class="nc-cnt">${g.names.length}명</span>
      <button class="btn btn-line btn-sm" onclick="resolveNote([${g.ids.join(',')}])">완료 표시</button></div>`;
  const doneRow = g => `
    <div class="nc-item"><span class="nc-date">${md(g.at)}</span>
      <div class="nc-main"><strong>${short(g.label)}</strong></div>
      <span class="nc-cnt">${g.n}명</span></div>`;
  const gRow = g => `
    <div class="card"><strong>${esc(g.label)}</strong><br>
      <span class="meta">${g.names.length}명 · ${g.names.join(', ')} · 첫 요청 ${fmtDate(g.at)}</span></div>`;
  const row = o => `
    <div class="card"><strong>${esc(o.label)}</strong><br>
      <span class="meta">${esc(o.author_name || '회원')}${rtag(o.user_id)} · ${fmtDate(o.created_at)}
      · ${o.query && o.query.auto ? '자동 카톡' : '자료실에서 받음'}${o.kakao_sent ? ' (카톡 발송)' : ' (카톡 미발송)'} · ${esc(o.file_name || '')}</span></div>`;

  $('#panel').innerHTML = `
    <style>
      .nc-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; margin-top: 14px; }
      @media (max-width: 720px) { .nc-cols { grid-template-columns: 1fr; } }
      .nc-col { background: var(--card, #fff); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; min-width: 0; }
      .nc-col h2 { margin: 0 0 8px; font-size: 1.05rem; }
      .nc-col.todo { border-top: 4px solid #c2410c; }
      .nc-col.done { border-top: 4px solid #2f855a; }
      .nc-item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
      .nc-main { flex: 1; min-width: 0; }
      .nc-main strong { display: block; font-size: .95rem; word-break: keep-all; }
      .nc-cnt { font-weight: 700; color: var(--navy); white-space: nowrap; font-size: .9rem; }
      .nc-date { color: var(--muted); font-size: .85rem; white-space: nowrap; min-width: 38px; }
      .nc-empty { color: var(--muted); padding: 10px 0; border-top: 1px solid var(--line); margin: 0; }
      .nc-warn { background: #fff7ed; border: 1px solid #fed7aa; border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; font-size: .88rem; color: #9a3412; }
      details.nc-log { margin-top: 18px; }
      details.nc-log summary { cursor: pointer; color: var(--muted); font-weight: 700; padding: 8px 0; }
    </style>
    <div class="card"><p class="mt" style="margin:0"><button class="btn btn-navy btn-sm" id="scan-btn" onclick="scanDrive()">드라이브 확인</button>
    <span class="meta">자료를 올린 뒤 누르면 바로 '완료'로 옮겨져요. (안 눌러도 매시 5분, 08~22시에 자동 확인)</span></p>
    <div id="scan-out"></div></div>
    <div class="card"><b>👥 요청하는 분들</b> <span class="meta">첫 요청 때 한 번 고름 · 2026-11-15부터</span>
      <p style="margin:6px 0 0">학생 <b>${rcnt('student')}명</b> · 선생님·강사 <b>${rcnt('teacher')}명</b> · 학부모 <b>${rcnt('parent')}명</b> <span class="meta">(모두 ${(mr || []).length}명)</span></p>
      <p class="meta" style="margin:4px 0 0">이름 옆 [학생]·[선생님·강사]·[학부모] 표시는 아래 '전송 기록 보기'에서 볼 수 있어요.</p></div>
    <div class="nc-cols">
      <section class="nc-col todo">
        <h2>🛠️ 만들어야 할 자료 ${gm.length}개</h2>
        ${issues.length ? `<div class="nc-warn"><b>⚠️ 직접 안내 필요 ${issues.length}건</b> <span style="opacity:.8">자동 카톡을 못 보냈어요 · 자료실 로그인(카톡 메시지 받기 동의) 안내</span>${issues.map(o => `<br>· ${esc(o.author_name || '회원')} — ${short(o.label)} (${KAKAO_ISSUE[o.kakao_issue]})`).join('')}</div>` : ''}
        ${gm.map(todoRow).join('') || '<p class="nc-empty">없어요. 👍</p>'}
      </section>
      <section class="nc-col done">
        <h2>✅ 완료한 자료 ${done.length}개 <span class="meta">최근 7일</span></h2>
        ${done.map(doneRow).join('') || '<p class="nc-empty">최근 7일 동안 완료한 자료가 없어요.</p>'}
      </section>
    </div>
    <details class="nc-log"><summary>전송 기록 보기 (수령 대기 ${gw.length}개 · 보낸 자료 ${sent.length}건)</summary>
      <p class="muted">파일 이름 규칙 — 모의고사: <b>2026-09_고1_30번_분석노트.pdf</b> (또는 <b>2026년 9월 고1</b> 폴더 안 <b>30번.pdf</b>) · 부교재: <b>2026 수능특강 라이트 20강 1번 분석노트.pdf</b> · 이름에 <b>문제·정답·해설·듣기</b>가 들어가면 건너뛰어요. 올리면 처음 요청한 1개만 자동 카톡, 나머지는 학생이 자료실에 로그인해서 받아요.</p>
      <h2 class="mt">📦 올림 · 학생 수령 대기 ${gw.length}개</h2>
      ${gw.map(gRow).join('') || '<div class="card"><p class="muted">없어요.</p></div>'}
      <h2 class="mt">보낸 자료 ${sent.length}건</h2>
      ${sent.map(row).join('') || '<div class="card"><p class="muted">아직 없어요.</p></div>'}
    </details>`;
}

async function resolveNote(ids) {
  const { error } = await sb.from('note_orders').update({ status: 'resolved' }).in('id', [].concat(ids));
  if (error) return toast('오류: ' + error.message);
  toast('완료로 표시했어요. 드라이브에 파일이 있어야 학생이 받을 수 있어요.');
  showTab('notes');
}

// 드라이브 확인: 만들어야 할 자료를 드라이브와 다시 맞춰 봄. 못 찾으면 같은 회차 폴더의 파일 이름을 보여 줌
async function scanDrive() {
  const btn = $('#scan-btn'); btn.disabled = true; btn.textContent = '확인 중...';
  const { data: { session } } = await sb.auth.getSession();
  let r = {};
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/note-request`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: `Bearer ${session.access_token}` },
      body: JSON.stringify({ kind: 'admin_scan' })
    });
    r = await res.json();
  } catch (e) { r = { error: '확인 중 오류가 났어요.' }; }
  btn.disabled = false; btn.textContent = '드라이브 확인';
  if (r.error) return $('#scan-out').innerHTML = `<p class="meta" style="color:var(--danger)">${esc(r.error)}</p>`;
  const ok = (r.ready || []).map(x => `<li>✅ <b>${esc(x.label)}</b> <span class="meta">${esc(x.file)}</span></li>`).join('');
  const no = (r.missing || []).map(x => `<li>❌ <b>${esc(x.label)}</b>${x.near.length
    ? `<br><span class="meta">같은 회차·교재 폴더에 있는 파일: ${x.near.map(esc).join(' · ')}</span>`
    : '<br><span class="meta">같은 회차·교재 폴더의 파일이 없어요 (아직 안 올렸거나 폴더 이름이 달라요)</span>'}</li>`).join('');
  const html = `<div class="mt" style="padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#f8fafc">
    <b>새로 찾은 자료 ${(r.ready || []).length}개</b>${ok ? `<ul style="margin:6px 0;padding-left:18px">${ok}</ul>` : ''}
    <b>아직 못 찾은 자료 ${(r.missing || []).length}개</b>${no ? `<ul style="margin:6px 0;padding-left:18px">${no}</ul>` : ''}</div>`;
  if ((r.ready || []).length) await showTab('notes'); // 목록 새로 그리기 (찾은 자료는 '수령 대기'로 이동)
  $('#scan-out').innerHTML = html;
}

/* ---------- 자료 관리 ---------- */
async function tabMaterials() {
  const { data } = await sb.from('materials')
    .select('id,title,description,required_comments,created_at')
    .order('created_at', { ascending: false });

  $('#panel').innerHTML = `
    <div class="card">
      <h2>➕ 새 자료 등록</h2>
      <input type="text" id="mtitle" placeholder="자료 제목 (예: 2026년 10월 고2 모의고사 분석노트)">
      <textarea id="mdesc" class="mt" placeholder="자료 설명 (어떤 자료인지, 누구에게 도움이 되는지)"></textarea>
      <div class="row mt">
        <span class="muted">필요한 승인 댓글 수</span>
        <input type="number" id="mreq" value="${MISSION_GOAL}" min="1" style="width:90px">
        <button class="btn btn-navy" onclick="addMaterial()">등록</button>
      </div>
    </div>
    <h2>등록된 자료 ${data?.length || 0}개</h2>
    ${(data || []).map(m => `
      <div class="card">
        <div class="row between">
          <div>
            <strong>${esc(m.title)}</strong>
            <span class="tag">댓글 ${m.required_comments}개</span><br>
            <span class="meta">${fmtDate(m.created_at)} · <a href="/mission/?id=${m.id}" target="_blank">페이지 보기</a></span>
          </div>
          <button class="btn btn-danger btn-sm" onclick="removeMaterial(${m.id})">삭제</button>
        </div>
      </div>`).join('')}`;
}

async function addMaterial() {
  const title = $('#mtitle').value.trim();
  const description = $('#mdesc').value.trim();
  const required_comments = Number($('#mreq').value) || MISSION_GOAL;
  if (!title) return toast('제목을 입력해 주세요.');

  const { error } = await sb.from('materials').insert({ title, description, required_comments });
  if (error) return toast('오류: ' + error.message);
  toast('자료를 등록했어요.');
  showTab('materials');
}

async function removeMaterial(id) {
  if (!confirm('이 자료를 삭제할까요? 연결된 댓글과 요청도 함께 삭제됩니다.')) return;
  const { error } = await sb.from('materials').delete().eq('id', id);
  if (error) return toast('오류: ' + error.message);
  toast('삭제했어요.');
  showTab('materials');
}

/* ---------- 시작 ---------- */
(async function init() {
  user = await getUser();
  renderAuth(user);

  if (!user) {
    $('#main').innerHTML = `<div class="card"><h2>관리자 로그인</h2>
      <p class="muted">관리자 계정으로 로그인해 주세요.</p>
      ${loginButtons(true)}</div>`;
    return;
  }

  const { data: isAdmin } = await sb.rpc('is_admin');
  if (!isAdmin) {
    $('#main').innerHTML = `<div class="card"><h2>관리자 권한이 없어요</h2>
      <p class="muted">현재 로그인: ${esc(user.email || displayName(user))}<br>
      Supabase SQL Editor에서 이 계정을 관리자로 등록한 뒤 새로고침해 주세요.</p></div>`;
    return;
  }

  try { localStorage.setItem('lks_admin', '1'); } catch (e) {} // 이 브라우저의 원장님 방문은 방문자 수에서 빼요
  shell();
  showTab('comments');
})();
</script>
