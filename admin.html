<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>관리자 | 리카수니 자료실</title>
<link rel="stylesheet" href="/style.css?v=4">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="/common.js"></script>
</head>
<body>

<header class="top">
  <div class="top-in">
    <a class="brand" href="/">리카수니 <b>관리자</b></a>
    <div class="auth" id="auth"></div>
  </div>
</header>

<main class="wrap" id="main"><p class="muted">불러오는 중...</p></main>

<footer><a href="/">← 자료실로 돌아가기</a></footer>

<script>
let user = null;
let current = 'comments';

/* ---------- 탭 ---------- */
function shell() {
  $('#main').innerHTML = `
    <div class="tabs">
      <button class="tab" data-t="comments" onclick="showTab('comments')">댓글 승인 <span id="n-comments"></span></button>
      <button class="tab" data-t="notes" onclick="showTab('notes')">분석노트 신청 <span id="n-notes"></span></button>
      <button class="tab" data-t="files" onclick="showTab('files')">분석노트 파일</button>
      <button class="tab" data-t="requests" onclick="showTab('requests')">자료 요청 <span id="n-requests"></span></button>
      <button class="tab" data-t="materials" onclick="showTab('materials')">자료 관리</button>
    </div>
    <section id="panel"></section>`;
}

async function showTab(t) {
  current = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  $('#panel').innerHTML = '<p class="muted">불러오는 중...</p>';
  if (t === 'comments') await tabComments();
  if (t === 'requests') await tabRequests();
  if (t === 'materials') await tabMaterials();
  if (t === 'notes') await tabNotes();
  if (t === 'files') await tabFiles();
  updateBadges();
}

async function updateBadges() {
  const c = await sb.from('comments').select('id', { count: 'exact', head: true }).eq('approved', false);
  const r = await sb.from('requests').select('id', { count: 'exact', head: true }).eq('status', 'pending');
  $('#n-comments').textContent = c.count ? `(${c.count})` : '';
  $('#n-requests').textContent = r.count ? `(${r.count})` : '';
  const n = await sb.from('note_requests').select('id', { count: 'exact', head: true }).eq('status', 'pending');
  $('#n-notes').textContent = n.count ? `(${n.count})` : '';
}

/* ---------- 댓글 승인 ---------- */
async function tabComments() {
  const { data, error } = await sb.from('comments')
    .select('id,author_name,content,created_at,material_id,page_key,page_title,materials(title)')
    .eq('approved', false).order('created_at', { ascending: true });

  if (error) return $('#panel').innerHTML = `<p class="muted">오류: ${esc(error.message)}</p>`;
  if (!data.length) return $('#panel').innerHTML = `<div class="card"><p class="muted">승인 대기 중인 댓글이 없어요. 👍</p></div>`;

  $('#panel').innerHTML = `
    <div class="row between" style="margin-bottom:10px">
      <span class="muted">승인 대기 ${data.length}개</span>
      <button class="btn btn-navy btn-sm" onclick="approveAll()">전체 승인</button>
    </div>
    ${data.map(c => `
      <div class="card">
        <div class="row">
          <strong>${esc(c.author_name || '익명')}</strong>
          <span class="tag">${c.page_key ? `<a href="/${esc(c.page_key)}/" target="_blank">${esc(c.page_title || c.page_key)}</a>` : esc(c.materials?.title || '')}</span>
          <span class="meta">${fmtDate(c.created_at)}</span>
        </div>
        <p class="body" style="white-space:pre-wrap;margin:8px 0">${esc(c.content)}</p>
        <div class="row">
          <button class="btn btn-gold btn-sm" onclick="approve(${c.id})">승인</button>
          <button class="btn btn-danger btn-sm" onclick="removeComment(${c.id})">삭제</button>
        </div>
      </div>`).join('')}`;
}

async function approve(id) {
  const { error } = await sb.from('comments').update({ approved: true }).eq('id', id);
  if (error) return toast('오류: ' + error.message);
  toast('승인했어요.');
  showTab('comments');
}

async function approveAll() {
  if (!confirm('대기 중인 댓글을 모두 승인할까요?')) return;
  const { error } = await sb.from('comments').update({ approved: true }).eq('approved', false);
  if (error) return toast('오류: ' + error.message);
  toast('모두 승인했어요.');
  showTab('comments');
}

async function removeComment(id) {
  if (!confirm('이 댓글을 삭제할까요?')) return;
  const { error } = await sb.from('comments').delete().eq('id', id);
  if (error) return toast('오류: ' + error.message);
  toast('삭제했어요.');
  showTab('comments');
}

/* ---------- 자료 요청 ---------- */
async function tabRequests() {
  const { data, error } = await sb.from('requests')
    .select('id,email,status,created_at,materials(title)')
    .order('created_at', { ascending: false });

  if (error) return $('#panel').innerHTML = `<p class="muted">오류: ${esc(error.message)}</p>`;
  if (!data.length) return $('#panel').innerHTML = `<div class="card"><p class="muted">아직 들어온 요청이 없어요.</p></div>`;

  $('#panel').innerHTML = data.map(r => `
    <div class="card">
      <div class="row between">
        <div>
          <strong>${esc(r.materials?.title || '')}</strong><br>
          <span>${esc(r.email)}</span>
          <span class="meta"> · ${fmtDate(r.created_at)}</span>
        </div>
        <div class="row">
          ${r.status === 'sent'
            ? '<span class="tag ok">전달 완료</span>'
            : `<button class="btn btn-line btn-sm" onclick="copyText('${esc(r.email)}')">이메일 복사</button>
               <button class="btn btn-gold btn-sm" onclick="markSent(${r.id})">전달 완료</button>`}
        </div>
      </div>
    </div>`).join('');
}

async function markSent(id) {
  const { error } = await sb.from('requests').update({ status: 'sent' }).eq('id', id);
  if (error) return toast('오류: ' + error.message);
  toast('전달 완료로 표시했어요.');
  showTab('requests');
}

function copyText(t) {
  navigator.clipboard.writeText(t).then(() => toast('복사했어요: ' + t));
}

/* ---------- 분석노트 신청 ---------- */
async function tabNotes() {
  const { data, error } = await sb.from('note_requests')
    .select('id,user_id,page_key,num,status,created_at,decided_at,link_token,comment_id,comments(author_name,content,approved,page_title)')
    .order('created_at', { ascending: false }).limit(200);
  if (error) return $('#panel').innerHTML = `<p class="muted">오류: ${esc(error.message)}</p>`;
  if (!data.length) return $('#panel').innerHTML = `<div class="card"><p class="muted">아직 들어온 신청이 없어요.</p></div>`;
  const label = { pending: '<span class="tag wait">대기</span>', approved: '<span class="tag ok">승인</span>', rejected: '<span class="tag">거절</span>' };
  $('#panel').innerHTML = `<p class="muted">승인하면 신청자 화면에 바로 다운로드 버튼이 생기고(7일간), 카톡으로 보낼 링크 메시지도 복사할 수 있어요. 신청 댓글도 함께 승인돼 미션 개수에 합산돼요.</p>` +
    data.map(r => `
    <div class="card">
      <div class="row">
        <strong>${esc(r.comments?.author_name || '회원')}</strong> ${label[r.status]}
        <span class="tag"><a href="/${esc(r.page_key)}/" target="_blank">${esc(r.comments?.page_title || r.page_key)}</a> · ${r.num}번</span>
        <span class="meta">${fmtDate(r.created_at)}</span>
      </div>
      <p class="body" style="white-space:pre-wrap;margin:8px 0">${esc(r.comments?.content || '(댓글 삭제됨)')}</p>
      ${r.status === 'pending' ? `<div class="row">
        <button class="btn btn-gold btn-sm" onclick="decideNote(${r.id}, 'approved', ${r.comment_id || 'null'})">승인</button>
        <button class="btn btn-danger btn-sm" onclick="decideNote(${r.id}, 'rejected', null)">거절</button></div>` : ''}
      ${r.status === 'approved' && r.link_token ? `<div class="row">
        <button class="btn btn-kakao btn-sm" onclick="copyNoteLink('${esc(r.comments?.page_title || r.page_key)}', ${r.num}, '${r.link_token}', '${r.decided_at}')">💬 카톡 메시지 복사</button>
        <span class="meta">승인 후 7일 동안 열리는 링크</span></div>` : ''}
    </div>`).join('');
}

function newToken() {
  return [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, '0')).join('');
}
function noteLink(r) { return `https://data.likasuni.com/get/?t=${r.link_token}`; }
function copyNoteLink(title, num, token, decided) {
  const until = new Date(new Date(decided).getTime() + 7 * 86400000);
  const msg = `[리카수니 자료실] ${title} ${num}번 분석노트가 준비됐어요 📘\n아래 링크에서 받으세요. (${fmtDate(until)}까지)\nhttps://data.likasuni.com/get/?t=${token}`;
  navigator.clipboard.writeText(msg).then(() => toast('카톡에 붙여넣을 메시지를 복사했어요.'));
}

async function decideNote(id, status, commentId) {
  if (status === 'rejected' && !confirm('이 신청을 거절할까요? 거절하면 신청자가 이 회차에서 다시 신청할 수 있어요.')) return;
  const patch = { status, decided_at: new Date().toISOString() };
  if (status === 'approved') patch.link_token = newToken();
  const { error } = await sb.from('note_requests').update(patch).eq('id', id);
  if (error) return toast('오류: ' + error.message);
  if (status === 'approved' && commentId) await sb.from('comments').update({ approved: true }).eq('id', commentId);
  toast(status === 'approved' ? '승인했어요. 신청자가 바로 받을 수 있어요.' : '거절했어요.');
  showTab('notes');
}

/* ---------- 분석노트 파일 ---------- */
function pageKeyFrom(v) {
  return v.trim().replace(/^https?:\/\/[^/]+/, '').replace(/^\/+|\/+$/g, '');
}
async function tabFiles() {
  const { data } = await sb.from('note_files').select('id,page_key,num,title,path,created_at').order('page_key').order('num');
  $('#panel').innerHTML = `
    <div class="card">
      <h2>➕ 번호별 분석노트 올리기</h2>
      <p class="muted">과목 페이지 주소를 붙여넣고 번호와 PDF를 고르세요. 같은 번호를 다시 올리면 파일이 교체돼요.</p>
      <input type="text" id="fpage" placeholder="예) https://data.likasuni.com/moe/go1/2026-06/eng/">
      <div class="row mt">
        <input type="number" id="fnum" placeholder="번호" min="1" max="45" style="width:90px">
        <input type="text" id="ftitle" placeholder="설명(선택) 예) 빈칸 추론" style="flex:1;min-width:160px">
      </div>
      <input type="file" id="ffile" class="mt" accept="application/pdf" multiple>
      <p class="meta">여러 파일을 한 번에 올릴 때는 파일 이름을 번호로(예: 30.pdf, 31.pdf) 해두면 번호가 자동으로 들어가요.</p>
      <button class="btn btn-navy mt" onclick="uploadNotes()">올리기</button>
    </div>
    <div class="card">
      <h2>🔗 구글드라이브 링크로 등록</h2>
      <p class="muted">파일을 올리지 않고 드라이브 링크만 연결해요. 한 줄에 <b>번호 링크</b> 형식으로 적어주세요. 링크는 학생에게 보이지 않고, 승인된 학생만 승인 후 7일 동안 받을 수 있어요.<br>
      드라이브 파일은 공유 설정을 <b>'링크가 있는 모든 사용자'</b>로 해두어야 해요.</p>
      <input type="text" id="dpage" placeholder="과목 페이지 주소 예) https://data.likasuni.com/moe/go2/2024-10/eng/">
      <textarea id="dlines" class="mt" placeholder="20 https://drive.google.com/file/d/xxxx/view&#10;26 https://drive.google.com/file/d/yyyy/view"></textarea>
      <button class="btn btn-navy mt" onclick="linkDrive()">등록</button>
    </div>
    <h2>등록된 파일 ${data?.length || 0}개</h2>
    ${(data || []).map(f => `
      <div class="card"><div class="row between">
        <div><strong><a href="/${esc(f.page_key)}/" target="_blank">${esc(f.page_key)}</a> · ${f.num}번</strong> ${f.title ? `<span class="tag">${esc(f.title)}</span>` : ''}<br>
        <span class="meta">${fmtDate(f.created_at)}</span></div>
        <span class="tag">${f.path ? '업로드' : '드라이브'}</span>
        <button class="btn btn-danger btn-sm" onclick="removeNote(${f.id}, '${esc(f.path || '')}')">삭제</button>
      </div></div>`).join('')}`;
}

async function uploadNotes() {
  const page_key = pageKeyFrom($('#fpage').value);
  const files = [...$('#ffile').files];
  if (!page_key) return toast('과목 페이지 주소를 넣어주세요.');
  if (!files.length) return toast('PDF 파일을 골라주세요.');
  let ok = 0;
  for (const file of files) {
    const fromName = parseInt((file.name.match(/(\d+)/) || [])[1], 10);
    const num = files.length === 1 && $('#fnum').value ? Number($('#fnum').value) : fromName;
    if (!num) { toast(`${file.name}: 번호를 알 수 없어요.`); continue; }
    const path = `${page_key}/${num}.pdf`;
    const up = await sb.storage.from('notes').upload(path, file, { upsert: true, contentType: 'application/pdf' });
    if (up.error) { toast(`${num}번 업로드 실패: ${up.error.message}`); continue; }
    const title = files.length === 1 ? $('#ftitle').value.trim() || null : null;
    const { error } = await sb.from('note_files').upsert({ page_key, num, path, ...(title ? { title } : {}) }, { onConflict: 'page_key,num' });
    if (error) { toast(`${num}번 등록 실패: ${error.message}`); continue; }
    ok++;
  }
  toast(`${ok}개 올렸어요.`);
  showTab('files');
}

async function linkDrive() {
  const page_key = pageKeyFrom($('#dpage').value);
  if (!page_key) return toast('과목 페이지 주소를 넣어주세요.');
  let ok = 0;
  for (const line of $('#dlines').value.split('\n')) {
    const m = line.match(/^\s*(\d+)\D.*?(?:\/d\/|id=)([\w-]{20,})/);
    if (!m) { if (line.trim()) toast('형식 확인: ' + line.trim().slice(0, 30)); continue; }
    const num = Number(m[1]), drive_id = m[2];
    const a = await sb.from('note_files').upsert({ page_key, num, path: null }, { onConflict: 'page_key,num' });
    if (a.error) { toast(`${num}번 실패: ${a.error.message}`); continue; }
    const b = await sb.from('note_sources').upsert({ page_key, num, drive_id }, { onConflict: 'page_key,num' });
    if (b.error) { toast(`${num}번 실패: ${b.error.message}`); continue; }
    ok++;
  }
  toast(`${ok}개 연결했어요.`);
  showTab('files');
}

async function removeNote(id, path) {
  if (!confirm('이 파일을 삭제할까요? 이 번호의 신청 기록도 함께 삭제돼요.')) return;
  if (path) await sb.storage.from('notes').remove([path]);
  const { error } = await sb.from('note_files').delete().eq('id', id);
  if (error) return toast('오류: ' + error.message);
  toast('삭제했어요.');
  showTab('files');
}

/* ---------- 자료 관리 ---------- */
async function tabMaterials() {
  const { data } = await sb.from('materials')
    .select('id,title,description,required_comments,created_at')
    .order('created_at', { ascending: false });

  $('#panel').innerHTML = `
    <div class="card">
      <h2>➕ 새 자료 등록</h2>
      <input type="text" id="mtitle" placeholder="자료 제목 (예: 2026년 10월 고2 모의고사 분석노트)">
      <textarea id="mdesc" class="mt" placeholder="자료 설명 (어떤 자료인지, 누구에게 도움이 되는지)"></textarea>
      <div class="row mt">
        <span class="muted">필요한 승인 댓글 수</span>
        <input type="number" id="mreq" value="${MISSION_GOAL}" min="1" style="width:90px">
        <button class="btn btn-navy" onclick="addMaterial()">등록</button>
      </div>
    </div>
    <h2>등록된 자료 ${data?.length || 0}개</h2>
    ${(data || []).map(m => `
      <div class="card">
        <div class="row between">
          <div>
            <strong>${esc(m.title)}</strong>
            <span class="tag">댓글 ${m.required_comments}개</span><br>
            <span class="meta">${fmtDate(m.created_at)} · <a href="/mission/?id=${m.id}" target="_blank">페이지 보기</a></span>
          </div>
          <button class="btn btn-danger btn-sm" onclick="removeMaterial(${m.id})">삭제</button>
        </div>
      </div>`).join('')}`;
}

async function addMaterial() {
  const title = $('#mtitle').value.trim();
  const description = $('#mdesc').value.trim();
  const required_comments = Number($('#mreq').value) || MISSION_GOAL;
  if (!title) return toast('제목을 입력해 주세요.');

  const { error } = await sb.from('materials').insert({ title, description, required_comments });
  if (error) return toast('오류: ' + error.message);
  toast('자료를 등록했어요.');
  showTab('materials');
}

async function removeMaterial(id) {
  if (!confirm('이 자료를 삭제할까요? 연결된 댓글과 요청도 함께 삭제됩니다.')) return;
  const { error } = await sb.from('materials').delete().eq('id', id);
  if (error) return toast('오류: ' + error.message);
  toast('삭제했어요.');
  showTab('materials');
}

/* ---------- 시작 ---------- */
(async function init() {
  user = await getUser();
  renderAuth(user);

  if (!user) {
    $('#main').innerHTML = `<div class="card"><h2>관리자 로그인</h2>
      <p class="muted">관리자 계정으로 로그인해 주세요.</p>
      ${loginButtons()}</div>`;
    return;
  }

  const { data: isAdmin } = await sb.rpc('is_admin');
  if (!isAdmin) {
    $('#main').innerHTML = `<div class="card"><h2>관리자 권한이 없어요</h2>
      <p class="muted">현재 로그인: ${esc(user.email || displayName(user))}<br>
      Supabase SQL Editor에서 이 계정을 관리자로 등록한 뒤 새로고침해 주세요.</p></div>`;
    return;
  }

  shell();
  showTab('comments');
})();
</script>
</body>
</html>
