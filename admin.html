<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>관리자 | 리카수니 자료실</title>
<link rel="stylesheet" href="/style.css?v=4">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="/common.js"></script>
</head>
<body>

<header class="top">
  <div class="top-in">
    <a class="brand" href="/">리카수니 <b>관리자</b></a>
    <div class="auth" id="auth"></div>
  </div>
</header>

<main class="wrap" id="main"><p class="muted">불러오는 중...</p></main>

<footer><a href="/">← 자료실로 돌아가기</a></footer>

<script>
let user = null;
let current = 'comments';

/* ---------- 탭 ---------- */
function shell() {
  $('#main').innerHTML = `
    <div class="tabs">
      <button class="tab" data-t="comments" onclick="showTab('comments')">댓글 <span id="n-comments"></span></button>
      <button class="tab" data-t="notes" onclick="showTab('notes')">분석노트 요청 <span id="n-notes"></span></button>
      <button class="tab" data-t="requests" onclick="showTab('requests')">자료 요청 <span id="n-requests"></span></button>
      <button class="tab" data-t="materials" onclick="showTab('materials')">자료 관리</button>
    </div>
    <section id="panel"></section>`;
}

async function showTab(t) {
  current = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  $('#panel').innerHTML = '<p class="muted">불러오는 중...</p>';
  if (t === 'comments') await tabComments();
  if (t === 'requests') await tabRequests();
  if (t === 'materials') await tabMaterials();
  if (t === 'notes') await tabNotes();
  updateBadges();
}

async function updateBadges() {
  const c = await sb.from('comments').select('id', { count: 'exact', head: true }).eq('approved', false);
  const r = await sb.from('requests').select('id', { count: 'exact', head: true }).eq('status', 'pending');
  $('#n-comments').textContent = c.count ? `(${c.count})` : '';
  $('#n-requests').textContent = r.count ? `(${r.count})` : '';
  const n = await sb.from('note_orders').select('id', { count: 'exact', head: true }).eq('status', 'missing');
  $('#n-notes').textContent = n.count ? `(자료 없음 ${n.count})` : '';
}

/* ---------- 댓글 (한눈에 보기 · 승인 · 답글 · 회원별 모아보기) ---------- */
let cFilter = 'all', cUser = null;
async function tabComments() {
  let q = sb.from('comments')
    .select('id,author_name,content,created_at,approved,reply,user_id,page_key,page_title,materials(title)')
    .order('created_at', { ascending: false }).limit(200);
  if (cFilter === 'pending') q = q.eq('approved', false);
  if (cFilter === 'noreply') q = q.is('reply', null);
  if (cUser) q = q.eq('user_id', cUser.id);
  const { data, error } = await q;
  if (error) return $('#panel').innerHTML = `<p class="muted">오류: ${esc(error.message)}</p>`;
  const pend = data.filter(c => !c.approved).length;
  const fb = (k, label) => `<button class="btn btn-sm ${cFilter === k ? 'btn-navy' : 'btn-line'}" onclick="setCFilter('${k}')">${label}</button>`;
  $('#panel').innerHTML = `
    <div class="card">
      <div class="row between" style="flex-wrap:wrap;gap:8px">
        <div class="row" style="gap:6px;flex-wrap:wrap">${fb('all', '전체 댓글')}${fb('pending', '승인 대기')}${fb('noreply', '답글 안 단 댓글')}</div>
        ${pend ? `<button class="btn btn-gold btn-sm" onclick="approveAll()">대기 ${pend}개 전체 승인</button>` : ''}
      </div>
      ${cUser ? `<p class="mt"><b>${esc(cUser.name)}</b> 님의 댓글만 보는 중 · <a href="#" onclick="cUser=null;showTab('comments');return false">전체로 돌아가기</a></p>` : '<p class="meta mt">회원 이름을 누르면 그 회원이 쓴 댓글만 모아 볼 수 있어요.</p>'}
    </div>
    ${data.length ? data.map(c => `
      <div class="card">
        <div class="row" style="flex-wrap:wrap;gap:6px">
          <a href="#" onclick="cUser={id:'${c.user_id}',name:${esc(JSON.stringify(c.author_name || '회원'))}};showTab('comments');return false"><strong>${esc(c.author_name || '익명')}</strong></a>
          <span class="tag" style="background:${c.approved ? '#e8f7ee;color:#166534' : '#fff4e0;color:#9a5b00'}">${c.approved ? '공개' : '승인 대기'}</span>
          <span class="tag">${c.page_key ? `<a href="/${esc(c.page_key)}/" target="_blank">${esc(c.page_title || c.page_key)}</a>` : esc(c.materials?.title || '')}</span>
          <span class="meta">${fmtDate(c.created_at)}</span>
        </div>
        <p class="body" style="white-space:pre-wrap;margin:8px 0">${esc(c.content)}</p>
        ${c.reply ? `<div class="reply"><b>내 답글</b><br>${esc(c.reply)}</div>` : ''}
        <div id="rp-${c.id}" style="display:none" class="mt">
          <textarea id="rt-${c.id}" rows="3" style="width:100%" placeholder="답글을 입력하세요">${esc(c.reply || '')}</textarea>
          <div class="row mt"><button class="btn btn-navy btn-sm" onclick="saveReply(${c.id})">답글 저장${c.approved ? '' : ' + 승인'}</button></div>
        </div>
        <div class="row mt" style="gap:6px">
          ${c.approved ? '' : `<button class="btn btn-gold btn-sm" onclick="approve(${c.id})">승인</button>`}
          <button class="btn btn-line btn-sm" onclick="document.getElementById('rp-${c.id}').style.display=''">${c.reply ? '답글 수정' : '답글 달기'}</button>
          <button class="btn btn-danger btn-sm" onclick="removeComment(${c.id})">삭제</button>
        </div>
      </div>`).join('') : '<div class="card"><p class="muted">해당하는 댓글이 없어요.</p></div>'}`;
}
function setCFilter(k) { cFilter = k; showTab('comments'); }

async function saveReply(id) {
  const reply = document.getElementById('rt-' + id).value.trim();
  const { error } = await sb.from('comments').update({ reply: reply || null, approved: true }).eq('id', id);
  if (error) return toast('오류: ' + error.message);
  toast(reply ? '답글을 저장하고 공개했어요.' : '답글을 지웠어요.');
  showTab('comments');
}

async function approve(id) {
  const { error } = await sb.from('comments').update({ approved: true }).eq('id', id);
  if (error) return toast('오류: ' + error.message);
  toast('승인했어요.');
  showTab('comments');
}

async function approveAll() {
  if (!confirm('대기 중인 댓글을 모두 승인할까요?')) return;
  const { error } = await sb.from('comments').update({ approved: true }).eq('approved', false);
  if (error) return toast('오류: ' + error.message);
  toast('모두 승인했어요.');
  showTab('comments');
}

async function removeComment(id) {
  if (!confirm('이 댓글을 삭제할까요?')) return;
  const { error } = await sb.from('comments').delete().eq('id', id);
  if (error) return toast('오류: ' + error.message);
  toast('삭제했어요.');
  showTab('comments');
}

/* ---------- 자료 요청 ---------- */
async function tabRequests() {
  const { data, error } = await sb.from('requests')
    .select('id,email,status,created_at,materials(title)')
    .order('created_at', { ascending: false });

  if (error) return $('#panel').innerHTML = `<p class="muted">오류: ${esc(error.message)}</p>`;
  if (!data.length) return $('#panel').innerHTML = `<div class="card"><p class="muted">아직 들어온 요청이 없어요.</p></div>`;

  $('#panel').innerHTML = data.map(r => `
    <div class="card">
      <div class="row between">
        <div>
          <strong>${esc(r.materials?.title || '')}</strong><br>
          <span>${esc(r.email)}</span>
          <span class="meta"> · ${fmtDate(r.created_at)}</span>
        </div>
        <div class="row">
          ${r.status === 'sent'
            ? '<span class="tag ok">전달 완료</span>'
            : `<button class="btn btn-line btn-sm" onclick="copyText('${esc(r.email)}')">이메일 복사</button>
               <button class="btn btn-gold btn-sm" onclick="markSent(${r.id})">전달 완료</button>`}
        </div>
      </div>
    </div>`).join('');
}

async function markSent(id) {
  const { error } = await sb.from('requests').update({ status: 'sent' }).eq('id', id);
  if (error) return toast('오류: ' + error.message);
  toast('전달 완료로 표시했어요.');
  showTab('requests');
}

function copyText(t) {
  navigator.clipboard.writeText(t).then(() => toast('복사했어요: ' + t));
}

/* ---------- 분석노트 요청 (카톡 자동 발송 기록) ---------- */
// 상태: missing = 만들어야 함 · resolved = 드라이브에 올림(학생 수령 대기) · sent = 보냄 · done = 기다리던 요청이 처리됨
async function tabNotes() {
  const { data, error } = await sb.from('note_orders')
    .select('id,author_name,label,status,file_name,kakao_sent,expires_at,created_at,query')
    .order('created_at', { ascending: false }).limit(300);
  if (error) return $('#panel').innerHTML = `<p class="muted">오류: ${esc(error.message)}</p>`;
  const missing = data.filter(o => o.status === 'missing');
  const waiting = data.filter(o => o.status === 'resolved');
  const sent = data.filter(o => o.status === 'sent');
  // 같은 자료는 한 줄로 묶어 요청한 학생 이름을 함께 (오래된 요청 순)
  const group = list => {
    const m = new Map();
    for (const o of [...list].reverse()) { const g = m.get(o.label) || { label: o.label, ids: [], names: [], at: o.created_at }; g.ids.push(o.id); g.names.push(o.author_name || '회원'); m.set(o.label, g); }
    return [...m.values()];
  };
  const gRow = (g, btn) => `
    <div class="card"><div class="row between">
      <div><strong>${esc(g.label)}</strong><br>
        <span class="meta">${g.names.length}명 · ${esc(g.names.join(', '))} · 첫 요청 ${fmtDate(g.at)}</span></div>
      ${btn ? `<button class="btn btn-line btn-sm" onclick="resolveNote([${g.ids.join(',')}])">직접 준비 완료 표시</button>` : ''}
    </div></div>`;
  const row = o => `
    <div class="card"><div class="row between">
      <div><strong>${esc(o.label)}</strong><br>
        <span class="meta">${esc(o.author_name || '회원')} · ${fmtDate(o.created_at)}
        · ${o.query && o.query.auto ? '<b style="color:#b7791f">자동 카톡</b>' : '<b style="color:#2f855a">자료실에서 받음</b>'}${o.kakao_sent ? ' (카톡 발송)' : ' (카톡 미발송 · 페이지에서 열기)'} · ${esc(o.file_name || '')}</span></div>
    </div></div>`;
  const gm = group(missing), gw = group(waiting);
  $('#panel').innerHTML = `
    <div class="card"><p class="muted">학생이 요청하면 구글드라이브에서 파일 이름으로 찾아 24시간 링크를 카톡으로 보내요. 없던 자료는 올리면 <b>처음 요청한 1개만 자동 카톡</b>으로 가고, 나머지는 학생이 자료실에 로그인해서 받아요.<br>
    파일 이름 규칙 — 모의고사: <b>2026-09_고1_30번_분석노트.pdf</b> (또는 <b>2026년 9월 고1</b> 폴더 안 <b>30번.pdf</b>) · 부교재: <b>2026 수능특강 라이트 20강 1번 분석노트.pdf</b><br>
    파일 이름에 <b>문제·정답·해설·듣기</b>가 들어가면 건너뛰어요.</p>
    <p class="mt"><button class="btn btn-navy btn-sm" id="scan-btn" onclick="scanDrive()">드라이브 확인</button>
    <span class="meta">자료를 올린 뒤 누르면 바로 '준비 완료'로 바뀌어요. (안 눌러도 매시 5분, 08~22시에 자동 확인)</span></p>
    <div id="scan-out"></div></div>
    <h2>🛠️ 만들어야 할 자료 ${gm.length}개 <span class="meta">요청 ${missing.length}건</span></h2>
    ${gm.map(g => gRow(g, true)).join('') || '<div class="card"><p class="muted">없어요. 👍</p></div>'}
    <h2 class="mt">📦 올림 · 학생 수령 대기 ${gw.length}개 <span class="meta">학생이 자료실에 로그인해서 받으면 '보낸 자료'로 옮겨져요</span></h2>
    ${gw.map(g => gRow(g, false)).join('') || '<div class="card"><p class="muted">없어요.</p></div>'}
    <h2 class="mt">✅ 보낸 자료 ${sent.length}건 <span class="meta">자동 카톡 ${sent.filter(o => o.query && o.query.auto).length} · 자료실에서 받음 ${sent.filter(o => !(o.query && o.query.auto)).length}</span></h2>
    ${sent.map(row).join('') || '<div class="card"><p class="muted">아직 없어요.</p></div>'}`;
}

async function resolveNote(ids) {
  const { error } = await sb.from('note_orders').update({ status: 'resolved' }).in('id', [].concat(ids));
  if (error) return toast('오류: ' + error.message);
  toast('준비 완료로 표시했어요. 드라이브에 파일이 있어야 학생이 받을 수 있어요.');
  showTab('notes');
}

// 드라이브 확인: 만들어야 할 자료를 드라이브와 다시 맞춰 봄. 못 찾으면 같은 회차 폴더의 파일 이름을 보여 줌
async function scanDrive() {
  const btn = $('#scan-btn'); btn.disabled = true; btn.textContent = '확인 중...';
  const { data: { session } } = await sb.auth.getSession();
  let r = {};
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/note-request`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: `Bearer ${session.access_token}` },
      body: JSON.stringify({ kind: 'admin_scan' })
    });
    r = await res.json();
  } catch (e) { r = { error: '확인 중 오류가 났어요.' }; }
  btn.disabled = false; btn.textContent = '드라이브 확인';
  if (r.error) return $('#scan-out').innerHTML = `<p class="meta" style="color:var(--danger)">${esc(r.error)}</p>`;
  const ok = (r.ready || []).map(x => `<li>✅ <b>${esc(x.label)}</b> <span class="meta">${esc(x.file)}</span></li>`).join('');
  const no = (r.missing || []).map(x => `<li>❌ <b>${esc(x.label)}</b>${x.near.length
    ? `<br><span class="meta">같은 회차·교재 폴더에 있는 파일: ${x.near.map(esc).join(' · ')}</span>`
    : '<br><span class="meta">같은 회차·교재 폴더의 파일이 없어요 (아직 안 올렸거나 폴더 이름이 달라요)</span>'}</li>`).join('');
  const html = `<div class="mt" style="padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#f8fafc">
    <b>새로 찾은 자료 ${(r.ready || []).length}개</b>${ok ? `<ul style="margin:6px 0;padding-left:18px">${ok}</ul>` : ''}
    <b>아직 못 찾은 자료 ${(r.missing || []).length}개</b>${no ? `<ul style="margin:6px 0;padding-left:18px">${no}</ul>` : ''}</div>`;
  if ((r.ready || []).length) await showTab('notes'); // 목록 새로 그리기 (찾은 자료는 '수령 대기'로 이동)
  $('#scan-out').innerHTML = html;
}

/* ---------- 자료 관리 ---------- */
async function tabMaterials() {
  const { data } = await sb.from('materials')
    .select('id,title,description,required_comments,created_at')
    .order('created_at', { ascending: false });

  $('#panel').innerHTML = `
    <div class="card">
      <h2>➕ 새 자료 등록</h2>
      <input type="text" id="mtitle" placeholder="자료 제목 (예: 2026년 10월 고2 모의고사 분석노트)">
      <textarea id="mdesc" class="mt" placeholder="자료 설명 (어떤 자료인지, 누구에게 도움이 되는지)"></textarea>
      <div class="row mt">
        <span class="muted">필요한 승인 댓글 수</span>
        <input type="number" id="mreq" value="${MISSION_GOAL}" min="1" style="width:90px">
        <button class="btn btn-navy" onclick="addMaterial()">등록</button>
      </div>
    </div>
    <h2>등록된 자료 ${data?.length || 0}개</h2>
    ${(data || []).map(m => `
      <div class="card">
        <div class="row between">
          <div>
            <strong>${esc(m.title)}</strong>
            <span class="tag">댓글 ${m.required_comments}개</span><br>
            <span class="meta">${fmtDate(m.created_at)} · <a href="/mission/?id=${m.id}" target="_blank">페이지 보기</a></span>
          </div>
          <button class="btn btn-danger btn-sm" onclick="removeMaterial(${m.id})">삭제</button>
        </div>
      </div>`).join('')}`;
}

async function addMaterial() {
  const title = $('#mtitle').value.trim();
  const description = $('#mdesc').value.trim();
  const required_comments = Number($('#mreq').value) || MISSION_GOAL;
  if (!title) return toast('제목을 입력해 주세요.');

  const { error } = await sb.from('materials').insert({ title, description, required_comments });
  if (error) return toast('오류: ' + error.message);
  toast('자료를 등록했어요.');
  showTab('materials');
}

async function removeMaterial(id) {
  if (!confirm('이 자료를 삭제할까요? 연결된 댓글과 요청도 함께 삭제됩니다.')) return;
  const { error } = await sb.from('materials').delete().eq('id', id);
  if (error) return toast('오류: ' + error.message);
  toast('삭제했어요.');
  showTab('materials');
}

/* ---------- 시작 ---------- */
(async function init() {
  user = await getUser();
  renderAuth(user);

  if (!user) {
    $('#main').innerHTML = `<div class="card"><h2>관리자 로그인</h2>
      <p class="muted">관리자 계정으로 로그인해 주세요.</p>
      ${loginButtons(true)}</div>`;
    return;
  }

  const { data: isAdmin } = await sb.rpc('is_admin');
  if (!isAdmin) {
    $('#main').innerHTML = `<div class="card"><h2>관리자 권한이 없어요</h2>
      <p class="muted">현재 로그인: ${esc(user.email || displayName(user))}<br>
      Supabase SQL Editor에서 이 계정을 관리자로 등록한 뒤 새로고침해 주세요.</p></div>`;
    return;
  }

  shell();
  showTab('comments');
})();
</script>
</body>
</html>
