<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>댓글 미션 자료 받기 | 리카수니 자료실</title>
<link rel="canonical" href="https://data.likasuni.com/mission/">
<meta name="description" content="리카수니 영어 자료실 - 학습 후기와 질문 댓글 미션을 달성하면 모의고사·내신 분석 자료를 받을 수 있어요.">
<meta property="og:title" content="리카수니 자료실">
<meta property="og:description" content="댓글 미션 달성하고 영어 분석 자료 받기">
<link rel="stylesheet" href="/style.css?v=4">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="/common.js"></script>
</head>
<body>

<header class="top">
  <div class="top-in">
    <a class="brand" href="/">리카수니 <b>자료실</b></a>
    <div class="auth" id="auth"></div>
  </div>
</header>

<main class="wrap">
  <section class="hero" id="hero">
    <h1>댓글 미션 달성하고 자료 받기</h1>
    <p>자료 글에 학습 후기나 질문을 남겨주세요. 원장님 확인 후 승인된 댓글이 미션에 반영됩니다.</p>
  </section>

  <section class="card mission" id="mission"></section>

  <!-- 광고 자리 1 : 애드센스 코드를 이 div 안에 붙여넣으면 표시됩니다 -->
  <div class="ad-slot"></div>

  <section id="main"><p class="muted">불러오는 중...</p></section>

  <!-- 광고 자리 2 -->
  <div class="ad-slot"></div>
</main>

<footer>
  © 리카수니 · <a href="https://likasuni.com" target="_blank">리카수니 블로그</a>
  <a href="/privacy.html">개인정보처리방침</a>
  <a href="/admin.html">관리자</a>
</footer>

<script>
const params = new URLSearchParams(location.search);
const materialId = params.get('id');
let user = null;
let approved = 0;
let pending = 0;

/* ---------- 내 미션 현황 ---------- */
async function loadCounts() {
  if (!user) return;
  const { data } = await sb.rpc('my_approved_count');
  approved = data || 0;
  const { count } = await sb.from('comments')
    .select('id', { count: 'exact', head: true })
    .eq('user_id', user.id).eq('approved', false);
  pending = count || 0;
}

function renderMission() {
  const el = $('#mission');
  if (!user) {
    el.innerHTML = `
      <h2>🎯 나의 미션</h2>
      <p class="muted">카카오 또는 구글 계정으로 로그인하면 댓글 미션을 시작할 수 있어요.<br>
      승인된 댓글 ${MISSION_GOAL}개를 모으면 원하는 자료를 요청할 수 있습니다.</p>
      ${loginButtons()}`;
    return;
  }
  const pct = Math.min(100, (approved / MISSION_GOAL) * 100);
  const done = approved >= MISSION_GOAL;
  el.innerHTML = `
    <div class="row between">
      <h2>🎯 나의 미션</h2>
      <strong>${approved} / ${MISSION_GOAL}</strong>
    </div>
    <div class="bar"><span style="width:${pct}%"></span></div>
    <p class="muted">승인된 댓글 ${approved}개 · 승인 대기 ${pending}개<br>
    ${done
      ? '🎉 미션 달성! 원하는 자료 글에서 <b>자료 요청</b>을 눌러주세요.'
      : `앞으로 <b>${MISSION_GOAL - approved}개</b> 더 승인되면 자료를 요청할 수 있어요.`}</p>`;
}

/* ---------- 자료 목록 ---------- */
async function renderList() {
  const { data, error } = await sb.from('materials')
    .select('id,title,description,required_comments,created_at')
    .order('created_at', { ascending: false });

  if (error) { $('#main').innerHTML = `<p class="muted">목록을 불러오지 못했어요.</p>`; return; }
  if (!data.length) { $('#main').innerHTML = `<div class="card"><p class="muted">아직 등록된 자료가 없어요. 곧 업데이트됩니다!</p></div>`; return; }

  $('#main').innerHTML = `
    <h2>📚 자료 목록</h2>
    <div class="list">
      ${data.map(m => `
        <a class="item" href="?id=${m.id}">
          <h3>${esc(m.title)}</h3>
          <p>${esc(m.description || '')}</p>
          <div class="row mt">
            <span class="tag">댓글 미션 ${m.required_comments}개</span>
            <span class="meta">${fmtDate(m.created_at).slice(0, 10)}</span>
          </div>
        </a>`).join('')}
    </div>`;
}

/* ---------- 자료 상세 ---------- */
async function renderDetail(id) {
  $('#hero').style.display = 'none';

  const { data: m, error } = await sb.from('materials')
    .select('id,title,description,required_comments').eq('id', id).single();
  if (error || !m) {
    $('#main').innerHTML = `<a class="back" href="./">← 자료 목록</a><div class="card"><p class="muted">자료를 찾을 수 없어요.</p></div>`;
    return;
  }
  document.title = `${m.title} | 리카수니 자료실`;

  const { data: comments } = await sb.from('comments')
    .select('id,author_name,content,approved,created_at,user_id')
    .eq('material_id', id).order('created_at', { ascending: true });

  const list = (comments || []).map(c => `
    <div class="comment">
      <div class="row">
        <strong>${esc(c.author_name || '익명')}</strong>
        ${!c.approved ? '<span class="tag wait">승인 대기</span>' : ''}
        <span class="meta">${fmtDate(c.created_at)}</span>
      </div>
      <p class="body">${esc(c.content)}</p>
    </div>`).join('') || '<p class="muted">첫 댓글을 남겨주세요!</p>';

  $('#main').innerHTML = `
    <a class="back" href="./">← 자료 목록</a>

    <article class="card">
      <span class="tag">댓글 미션 ${m.required_comments}개</span>
      <h1 style="font-size:1.35rem;margin:8px 0;color:var(--navy-d)">${esc(m.title)}</h1>
      <p style="white-space:pre-wrap;margin:0">${esc(m.description || '')}</p>
    </article>

    <section class="card" id="request"></section>

    <section class="card">
      <h2>💬 댓글</h2>
      ${commentForm(m.id)}
    </section>

    <section class="card">
      <h2>댓글 ${comments?.filter(c => c.approved).length || 0}개</h2>
      ${list}
    </section>`;

  await renderRequest(m);
}

function commentForm(mid) {
  if (!user) {
    return `<p class="muted">댓글을 남기려면 로그인해 주세요.</p>
            ${loginButtons()}`;
  }
  return `
    <p class="muted">학습 후기, 궁금한 점, 공부 계획 등을 <b>20자 이상</b> 남겨주세요. 성의 없는 댓글은 승인되지 않을 수 있어요.</p>
    <textarea id="cbody" maxlength="1000" placeholder="예) 이 지문에서 관계대명사 what 부분이 헷갈렸는데 설명 덕분에 이해했어요."
      oninput="$('#ccount').textContent=this.value.trim().length"></textarea>
    <div class="row between mt">
      <span class="meta"><span id="ccount">0</span>자 (20자 이상)</span>
      <button class="btn btn-navy" id="cbtn" onclick="submitComment(${mid})">댓글 등록</button>
    </div>`;
}

async function submitComment(mid) {
  const content = $('#cbody').value.trim();
  if (content.length < 20) return toast('20자 이상 작성해 주세요.');
  const btn = $('#cbtn');
  btn.disabled = true;

  const { error } = await sb.from('comments').insert({
    material_id: Number(mid),
    author_name: displayName(user),
    content
  });

  if (error) {
    btn.disabled = false;
    return toast('등록에 실패했어요: ' + error.message);
  }
  toast('댓글이 등록됐어요! 승인 후 미션에 반영됩니다.');
  await loadCounts();
  renderMission();
  await renderDetail(mid);
}

/* ---------- 자료 요청 ---------- */
async function renderRequest(m) {
  const el = $('#request');
  if (!user) {
    el.innerHTML = `<h2>📩 자료 요청</h2>
      <p class="muted">로그인 후 승인된 댓글 ${m.required_comments}개를 모으면 이 자료를 요청할 수 있어요.</p>`;
    return;
  }

  const { data: req } = await sb.from('requests')
    .select('status,created_at').eq('material_id', m.id).eq('user_id', user.id).maybeSingle();

  if (req) {
    el.innerHTML = `<h2>📩 자료 요청</h2>
      ${req.status === 'sent'
        ? '<p><span class="tag ok">전달 완료</span> 자료를 이메일로 보내드렸어요. 메일함(스팸함 포함)을 확인해 주세요.</p>'
        : `<p><span class="tag wait">요청 접수</span> ${fmtDate(req.created_at)}에 요청하셨어요. 확인 후 이메일로 보내드릴게요.</p>`}`;
    return;
  }

  const ok = approved >= m.required_comments;
  el.innerHTML = `
    <h2>📩 자료 요청</h2>
    ${ok ? `
      <p class="muted">미션 달성! 자료를 받을 이메일을 확인해 주세요.</p>
      <input type="email" id="remail" placeholder="자료를 받을 이메일 주소" value="${esc(user.email || '')}">
      <label class="check mt">
        <input type="checkbox" id="ragree">
        <span>자료 전달을 위해 이름·이메일을 수집·이용하는 데 동의합니다. (전달 완료 후 1년 보관 후 파기, <a href="/privacy.html" target="_blank">개인정보처리방침</a>)</span>
      </label>
      <button class="btn btn-gold mt" id="rbtn" onclick="submitRequest(${m.id})">자료 요청하기</button>
    ` : `
      <p class="muted">승인된 댓글 <b>${approved} / ${m.required_comments}</b>개 · 앞으로 ${m.required_comments - approved}개 더 필요해요.</p>
      <button class="btn btn-gold" disabled>자료 요청하기</button>
    `}`;
}

async function submitRequest(mid) {
  const email = $('#remail').value.trim();
  if (!/^\S+@\S+\.\S+$/.test(email)) return toast('이메일 주소를 확인해 주세요.');
  if (!$('#ragree').checked) return toast('개인정보 수집·이용에 동의해 주세요.');

  const btn = $('#rbtn');
  btn.disabled = true;
  const { error } = await sb.from('requests').insert({ material_id: Number(mid), email });

  if (error) {
    btn.disabled = false;
    if (error.code === '23505') return toast('이미 요청한 자료예요.');
    return toast('요청할 수 없어요. 승인된 댓글 수를 확인해 주세요.');
  }
  toast('요청이 접수됐어요! 확인 후 이메일로 보내드릴게요.');
  await renderDetail(mid);
}

/* ---------- 시작 ---------- */
(async function init() {
  user = await getUser();
  renderAuth(user);
  await loadCounts();
  renderMission();
  if (materialId) await renderDetail(materialId);
  else await renderList();
})();
</script>
</body>
</html>
